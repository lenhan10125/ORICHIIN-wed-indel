<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" type="image/x-icon" href="ORC.ico">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ORC Studio - Geometry Pro</title>
    <style>
        :root {
            --gura-blue: #99CCFF;
            --gura-dark: #0a0e14;
            --gura-accent: #3399FF;
            --gura-yellow: #FFD700;
            --gura-grey: #2c3e50;
            --gura-red: #e74c3c;
        }

        body, html {
            margin: 0; padding: 0; min-height: 100%; width: 100%;
            background: var(--gura-dark); color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #003366 0%, #0a0e14 100%);
            z-index: -1;
        }

        .wrapper { display: flex; flex-direction: column; align-items: center; padding: 20px; }

        .main-layout {
            display: grid; grid-template-columns: 350px 1fr;
            gap: 20px; width: 100%; max-width: 1200px;
        }

        .app-card {
            background: rgba(15, 20, 30, 0.9); border: 2px solid var(--gura-blue);
            border-radius: 8px; padding: 20px; box-shadow: 8px 8px 0px rgba(51, 153, 255, 0.2);
        }

        .btn-boxy {
            padding: 10px; border: 2px solid var(--gura-blue);
            background: rgba(153, 204, 255, 0.05); color: var(--gura-blue);
            font-weight: bold; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; font-size: 0.75rem;
            margin-bottom: 5px; border-radius: 4px;
        }
        .btn-boxy.active { background: var(--gura-blue); color: var(--gura-dark); box-shadow: 2px 2px 0px var(--gura-accent); transform: translate(2px, 2px); }
        .btn-boxy:hover:not(.active) { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--gura-accent); }

        .calc-input {
            width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px;
            background: #1a1f26; border: 1px solid var(--gura-blue);
            color: white; border-radius: 4px; box-sizing: border-box; outline: none;
        }
        .calc-input:focus { border-color: var(--gura-yellow); }

        .svg-container {
            background: #000; border: 2px solid var(--gura-grey);
            border-radius: 8px; width: 100%; height: 450px; position: relative;
        }

        .arrow-cap { fill: var(--gura-yellow); }
        .label-text { font-size: 14px; font-weight: bold; fill: var(--gura-yellow); }
        .angle-text { font-size: 12px; fill: white; }

        .solution-box {
            margin-top: 20px; padding: 20px; border-left: 5px solid var(--gura-yellow);
            background: rgba(255,255,255,0.05); display: none; line-height: 1.6;
        }
        
        .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }

        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="bg-overlay"></div>

<div class="wrapper">
    <h2 style="color: var(--gura-blue); text-shadow: 3px 3px 0px var(--gura-grey);">ORC GEOMETRY PRO</h2>

    <div class="main-layout">
        <div class="app-card">
            <h3 style="color: var(--gura-yellow); margin-top: 0;">CÀI ĐẶT THÔNG SỐ</h3>
            
            <label style="font-size: 0.8rem; color: var(--gura-blue);">KHOẢNG CÁCH (m)</label>
            <input type="number" id="dist" class="calc-input" placeholder="Nhập khoảng cách..." oninput="update()">

            <label style="font-size: 0.8rem; color: var(--gura-blue);">GÓC NÂNG (độ)</label>
            <input type="number" id="ang" class="calc-input" placeholder="Nhập góc..." oninput="update()">

            <label style="font-size: 0.8rem; color: var(--gura-blue);">VỊ TRÍ ĐẶT MỐC</label>
            <button id="toggleOffset" class="btn-boxy" onclick="toggleOffset()" style="width: 100%;">Mốc Đặt Trên Vật</button>
            <input type="number" id="offsetValue" class="calc-input" placeholder="Nhập chiều cao vật làm mốc (m)..." style="display:none; margin-top: 5px;" oninput="update()">

            <label style="font-size: 0.8rem; color: var(--gura-blue);">ĐỐI TƯỢNG ĐO</label>
            <div class="toggle-grid" id="objGrid">
                <button class="btn-boxy active" onclick="setObj('tree', this)">Cái Cây</button>
                <button class="btn-boxy" onclick="setObj('lamp', this)">Cột Đèn</button>
                <button class="btn-boxy" onclick="setObj('flag', this)">Cột Cờ</button>
                <button class="btn-boxy" onclick="setObj('wall', this)">Bức Tường</button>
            </div>

            <label style="font-size: 0.8rem; color: var(--gura-blue);">HIỂN THỊ</label>
            <div class="toggle-grid" id="toggleGrid">
                <button id="toggleNum" class="btn-boxy active" onclick="toggle('Num')">Ẩn/Hiện Số</button>
                <button id="toggleArrow" class="btn-boxy active" onclick="toggle('Arrow')">Mũi Tên</button>
                <button id="toggleSol" class="btn-boxy active" onclick="toggle('Sol')">Lời Giải</button>
                <button id="toggleFull" class="btn-boxy active" onclick="toggleStyle()">Chi Tiết</button>
            </div>
        </div>

        <div class="app-card">
            <div class="svg-container">
                <svg width="100%" height="100%" viewBox="0 0 600 400" id="mainSvg">
                    <defs>
                        <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                            <path d="M0,0 L10,5 L0,10 Z" class="arrow-cap" />
                        </marker>
                    </defs>
                    <!-- Mặt đất -->
                    <line x1="50" y1="350" x2="550" y2="350" stroke="#333" stroke-width="2" />
                    
                    <!-- Mũi tên đo khoảng cách mặt đất -->
                    <g id="arrowGroup">
                        <line id="arrowLine" x1="100" y1="375" x2="500" y2="375" stroke="var(--gura-yellow)" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)" />
                    </g>

                    <g id="objectGroup"></g>
                    
                    <!-- Các cạnh tam giác -->
                    <line id="lineKề" x1="100" y1="350" x2="500" y2="350" stroke="white" stroke-width="1" stroke-dasharray="5" style="display:none;" />
                    <line id="lineĐối" x1="500" y1="350" x2="500" y2="100" stroke="var(--gura-accent)" stroke-width="3" style="display:none;" />
                    <line id="lineHuyền" x1="100" y1="350" x2="500" y2="100" stroke="var(--gura-blue)" stroke-width="2" style="display:none;" />
                    
                    <!-- Nhãn số liệu -->
                    <g id="labelGroup">
                        <text id="txtD" x="300" y="340" class="label-text" text-anchor="middle"></text>
                        <text id="txtH" x="515" y="225" class="label-text"></text>
                        <text id="txtA" x="155" y="345" class="angle-text"></text>
                    </g>

                    <!-- Kí hiệu góc -->
                    <g id="angleGroup" style="display:none;">
                        <path id="arcA" d="" fill="none" stroke="var(--gura-yellow)" stroke-width="2" />
                    </g>

                    <!-- Hình vẽ trực quan: Người quan sát / Mốc -->
                    <g id="observerGroup">
                        <line id="observerBody" x1="100" y1="350" x2="100" y2="350" stroke="white" stroke-width="2" stroke-dasharray="3" />
                        <circle id="observerHead" cx="100" cy="350" r="5" fill="white" style="display:none;"/>
                    </g>
                    <text x="85" y="365" id="labelYou" fill="#888" style="font-size: 11px;">Bạn</text>
                </svg>
            </div>
            <div id="solBox" class="solution-box">
                <h3 id="solTitle" style="color: var(--gura-blue); margin-top: 0; font-size: 1.2rem;">LỜI GIẢI CHI TIẾT</h3>
                <div id="solContent" style="color: #e2e8f0;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentObj = 'tree';
    let state = { Num: true, Arrow: true, Sol: true, Full: true };
    let isOffset = false;

    function toggleOffset() {
        isOffset = !isOffset;
        const btn = document.getElementById('toggleOffset');
        const input = document.getElementById('offsetValue');
        if(isOffset) {
            btn.classList.add('active');
            input.style.display = 'block';
        } else {
            btn.classList.remove('active');
            input.style.display = 'none';
            input.value = '';
        }
        update();
    }

    function setObj(type, btn) {
        currentObj = type;
        const objBtns = document.querySelectorAll('#objGrid .btn-boxy');
        objBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        update();
    }

    function toggle(type) {
        state[type] = !state[type];
        const btn = document.getElementById('toggle' + type);
        if(state[type]) btn.classList.add('active');
        else btn.classList.remove('active');
        update();
    }

    function toggleStyle() {
        state.Full = !state.Full;
        const btn = document.getElementById('toggleFull');
        if(state.Full) {
            btn.classList.add('active');
            btn.innerText = "Chi Tiết";
        } else {
            btn.classList.remove('active');
            btn.innerText = "Ngắn Gọn";
        }
        update();
    }

    function drawObject(totalPHeight, endY) {
        let objHtml = '';
        const base = 350;
        if (currentObj === 'tree') {
            objHtml = `
                <path d="M490 ${base} L510 ${base} L505 ${endY + 40} L495 ${endY + 40} Z" fill="#5d4037"/>
                <circle cx="500" cy="${endY + 20}" r="30" fill="#2e7d32"/>
                <circle cx="480" cy="${endY + 40}" r="25" fill="#388e3c"/>
                <circle cx="520" cy="${endY + 40}" r="25" fill="#388e3c"/>
            `;
        } else if (currentObj === 'lamp') {
            objHtml = `
                <rect x="495" y="${endY}" width="10" height="${totalPHeight}" fill="#555"/>
                <circle cx="500" cy="${endY}" r="15" fill="var(--gura-yellow)"/>
                <rect x="480" y="${base-10}" width="40" height="10" fill="#333"/>
            `;
        } else if (currentObj === 'flag') {
            objHtml = `
                <line x1="500" y1="${base}" x2="500" y2="${endY}" stroke="white" stroke-width="4"/>
                <path d="M500 ${endY} L550 ${endY + 25} L500 ${endY + 50} Z" fill="#e74c3c"/>
                <circle cx="500" cy="${endY}" r="6" fill="#f1c40f"/>
            `;
        } else if (currentObj === 'wall') {
            objHtml = `
                <rect x="480" y="${endY}" width="40" height="${totalPHeight}" fill="#7f8c8d" stroke="#333"/>
                <line x1="480" y1="${endY + totalPHeight * 0.33}" x2="520" y2="${endY + totalPHeight * 0.33}" stroke="#333"/>
                <line x1="480" y1="${endY + totalPHeight * 0.66}" x2="520" y2="${endY + totalPHeight * 0.66}" stroke="#333"/>
            `;
        }
        document.getElementById('objectGroup').innerHTML = objHtml;
    }

    function update() {
        const dInput = document.getElementById('dist').value;
        const aInput = document.getElementById('ang').value;
        const d = parseFloat(dInput);
        const a = parseFloat(aInput);

        const startX = 100, groundY = 350, pDist = 400;

        document.getElementById('labelGroup').style.display = state.Num ? 'block' : 'none';
        document.getElementById('arrowGroup').style.display = state.Arrow ? 'block' : 'none';

        if (isNaN(d) || isNaN(a) || d <= 0 || a <= 0 || a >= 90) {
            document.getElementById('solBox').style.display = 'none';
            ['lineKề','lineĐối','lineHuyền','angleGroup'].forEach(id => document.getElementById(id).style.display = 'none');
            ['txtD','txtH','txtA'].forEach(id => document.getElementById(id).textContent = "");
            document.getElementById('observerHead').style.display = 'none';
            document.getElementById('observerBody').setAttribute('y2', groundY);
            drawObject(100, groundY - 100);
            return;
        }

        document.getElementById('solBox').style.display = state.Sol ? 'block' : 'none';
        ['lineKề','lineĐối','lineHuyền','angleGroup'].forEach(id => document.getElementById(id).style.display = 'block');

        // Logic tính toán hình học
        const rad = a * (Math.PI / 180);
        let h_calc = d * Math.tan(rad);
        let offsetH = 0;
        if (isOffset) {
            offsetH = parseFloat(document.getElementById('offsetValue').value) || 0;
        }
        let h_total = h_calc + offsetH;

        // Cảnh báo nếu cao quá
        if (h_total > 500) showPopup("⚠️ Cảnh báo: Chiều cao thực tế quá lớn!");

        // Tỷ lệ hiển thị (Scale pixels)
        let pHeight = pDist * Math.tan(rad);
        let pOffset = (offsetH / d) * pDist; // Tính tỷ lệ pixel mốc dựa trên d
        
        // Giới hạn để không vượt màn hình
        if (pHeight + pOffset > 300) {
            const scale = 300 / (pHeight + pOffset);
            pHeight *= scale;
            pOffset *= scale;
        }

        const baseY = groundY - pOffset;
        const endY = baseY - pHeight;

        // Cập nhật vị trí mốc (Bạn / Observer)
        document.getElementById('observerBody').setAttribute('y2', baseY);
        document.getElementById('observerHead').style.display = 'block';
        document.getElementById('observerHead').setAttribute('cy', baseY - 5);
        document.getElementById('labelYou').setAttribute('y', groundY + 15);

        // Cập nhật các đường tam giác (Bắt đầu từ baseY thay vì groundY)
        document.getElementById('lineKề').setAttribute('y1', baseY);
        document.getElementById('lineKề').setAttribute('y2', baseY);
        
        document.getElementById('lineĐối').setAttribute('y1', baseY);
        document.getElementById('lineĐối').setAttribute('y2', endY);
        
        document.getElementById('lineHuyền').setAttribute('y1', baseY);
        document.getElementById('lineHuyền').setAttribute('y2', endY);

        // Vẽ vật thể (Luôn đứng trên đất groundY nhưng cao đến endY)
        drawObject(groundY - endY, endY);

        // Cập nhật nhãn số liệu
        document.getElementById('txtD').textContent = d + " m";
        document.getElementById('txtD').setAttribute('y', baseY - 10);
        
        document.getElementById('txtH').textContent = "h = " + h_total.toFixed(2) + " m";
        document.getElementById('txtH').setAttribute('y', (baseY + endY)/2);
        
        document.getElementById('txtA').textContent = a + "°";

        // Cập nhật cung tròn góc nâng (Tại vị trí baseY)
        const arcR = 40; 
        const arcEndX = startX + arcR * Math.cos(rad);
        const arcEndY = baseY - arcR * Math.sin(rad);
        const arcPath = `M ${startX + arcR} ${baseY} A ${arcR} ${arcR} 0 0 0 ${arcEndX} ${arcEndY}`;
        document.getElementById('arcA').setAttribute('d', arcPath);
        document.getElementById('txtA').setAttribute('x', startX + arcR + 5);
        document.getElementById('txtA').setAttribute('y', baseY - 5);

        // Render lời giải
        const content = document.getElementById('solContent');
        document.getElementById('solTitle').innerText = state.Full ? "LỜI GIẢI CHI TIẾT" : "LỜI GIẢI RÚT GỌN";
        
if (state.Full) {
            content.innerHTML = `
                <div style="border: 1px solid var(--gura-blue); padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.2); line-height: 1.8;">
                    <h4 style="color: var(--gura-yellow); margin-top: 0; text-decoration: underline; letter-spacing: 1px;">PHÂN TÍCH TOÁN HỌC CHI TIẾT</h4>
                    
                    <p><b>1. Thiết lập hệ tọa độ và Giả thuyết:</b></p>
                    <ul style="font-size: 0.9rem; list-style-type: square; color: #cbd5e0;">
                        <li>Mô hình hóa đối tượng đo thành một tam giác vuông ABC vuông tại gốc vật thể.</li>
                        <li>Cạnh kề (Khoảng cách ngang): <b>d = ${d}m</b>.</li>
                        <li>Góc nâng quan sát (Elevation Angle): <b>&alpha; = ${a}&deg;</b>.</li>
                        <li>Yêu cầu: Xác định chiều cao đối diện góc nâng.</li>
                    </ul>

                    <p><b>2. Bảng mô hình hóa số liệu thực tế:</b></p>
                    <table style="width:100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 15px; border: 1px solid #333;">
                        <tr style="background: rgba(51, 153, 255, 0.1); border-bottom: 1px solid #444;">
                            <th style="text-align:left; padding: 8px;">Đại lượng</th>
                            <th style="text-align:left; padding: 8px;">Giá trị</th>
                            <th style="text-align:left; padding: 8px;">Vai trò hình học</th>
                        </tr>
                        <tr>
                            <td style="padding: 8px; border-bottom: 1px solid #222;">Khoảng cách (d)</td>
                            <td style="padding: 8px; border-bottom: 1px solid #222; color: var(--gura-yellow);">${d} m</td>
                            <td style="padding: 8px; border-bottom: 1px solid #222;">Cạnh kề tam giác</td>
                        </tr>
                        <tr>
                            <td style="padding: 8px; border-bottom: 1px solid #222;">Góc nâng (&alpha;)</td>
                            <td style="padding: 8px; border-bottom: 1px solid #222; color: var(--gura-yellow);">${a}&deg;</td>
                            <td style="padding: 8px; border-bottom: 1px solid #222;">Góc nhọn quan sát</td>
                        </tr>
                        ${isOffset ? `
                        <tr>
                            <td style="padding: 8px; border-bottom: 1px solid #222;">Chiều cao mốc (h_mốc)</td>
                            <td style="padding: 8px; border-bottom: 1px solid #222; color: var(--gura-yellow);">${offsetH} m</td>
                            <td style="padding: 8px; border-bottom: 1px solid #222;">Độ cao vị trí đặt máy đo</td>
                        </tr>` : ''}
                    </table>

                    <p><b>3. Tiến trình giải thuật lượng giác:</b></p>
                    <div style="background: #111; padding: 15px; border-radius: 4px; font-family: 'Consolas', monospace; border-left: 4px solid var(--gura-accent);">
                        <p style="margin: 8px 0; color: #888;">// Sử dụng hệ thức lượng trong tam giác vuông</p>
                        <p style="margin: 8px 0;">&bull; Bước A: tan(&alpha;) = Đối / Kề = h_đo / d</p>
                        <p style="margin: 8px 0;">&bull; Bước B: h_đo = d * tan(&alpha;)</p>
                        <p style="margin: 8px 0; color: var(--gura-yellow);">&bull; Bước C: h_đo = ${d} * tan(${a}&deg;) = ${h_calc.toFixed(4)} (m)</p>
                        ${isOffset ? `<p style="margin: 8px 0; color: var(--gura-accent);">&bull; Bước D: h_tổng = h_đo + h_mốc = ${h_calc.toFixed(2)} + ${offsetH}</p>` : ''}
                    </div>

                    <div style="margin-top: 20px; padding: 15px; background: linear-gradient(90deg, var(--gura-accent), var(--gura-blue)); color: var(--gura-dark); font-weight: 800; text-align: center; border-radius: 4px; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                        Kết quả cuối cùng: ${h_total.toFixed(2)} MÉT
                    </div>
                    
                    <p style="font-size: 0.75rem; color: #666; font-style: italic; margin-top: 15px; line-height: 1.4;">
                        * Ghi chú: Phép tính sử dụng đơn vị Radian trong hệ thống máy tính và được chuyển đổi từ độ. Độ chính xác được tối ưu hóa đến 4 chữ số thập phân trong quá trình xử lý trung gian.
                    </p>
                </div>
            `;
        } else {
            content.innerHTML = `Công thức: h = (${d} &times; tan(${a}&deg;)) + ${offsetH} <br><br><span style="font-family:monospace; color:var(--gura-yellow); font-size:1.1rem;">h &approx; <b>${h_total.toFixed(2)} (m)</b></span>.`;
        }
    }

    update();

    function showPopup(message) {
        const oldPopup = document.getElementById('orc-popup');
        if (oldPopup) oldPopup.remove();
        const popup = document.createElement('div');
        popup.id = 'orc-popup';
        Object.assign(popup.style, {
            position: 'fixed', top: '20px', left: '50%', transform: 'translateX(-50%)',
            backgroundColor: '#3399FF', color: 'white', padding: '15px 25px',
            borderRadius: '8px', border: '2px solid #FFD700', zIndex: '9999',
            cursor: 'pointer', fontWeight: 'bold', textAlign: 'center', boxShadow: '0 4px 15px rgba(0,0,0,0.5)'
        });
        popup.innerText = message + " (Nhấp để đóng)";
        document.body.appendChild(popup);
        popup.onclick = () => popup.remove();
        setTimeout(() => { if (popup.parentNode) popup.remove(); }, 5000);
    }
</script>
</body>
