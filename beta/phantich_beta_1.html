<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Parser – Tự Động Phân Tích Đề Thi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
:root {
  --ink: #0a0a0f;
  --paper: #fafaf8;
  --cream: #f2f0ea;
  --accent: #e63c2f;
  --accent2: #2b7fff;
  --gold: #c8973a;
  --muted: #7a7870;
  --border: #dddbd5;
  --success: #1a7a4a;
  --radius: 4px;
  --card-radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
}

/* LAYOUT */
.layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  background: var(--ink);
  color: var(--paper);
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.5rem;
  letter-spacing: -0.03em;
  line-height: 1.2;
}
.logo span { color: var(--accent); }

.logo-sub {
  font-size: .8rem;
  color: #888;
  margin-top: 4px;
  font-weight: 400;
  letter-spacing: .04em;
  text-transform: uppercase;
}

/* UPLOAD ZONE */
.upload-zone {
  border: 1.5px dashed #444;
  border-radius: var(--card-radius);
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: all .25s;
  position: relative;
  background: #111;
}
.upload-zone:hover, .upload-zone.drag {
  border-color: var(--accent);
  background: #1a0e0d;
}
.upload-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.upload-icon-big { font-size: 2.2rem; margin-bottom: 10px; }
.upload-zone p { font-size: .88rem; color: #aaa; line-height: 1.5; }
.upload-zone strong { color: var(--paper); }
.file-badge {
  margin-top: 10px;
  background: #1e3a5f;
  color: #7eb8ff;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: .8rem;
  font-weight: 600;
  display: none;
}
.file-badge.show { display: inline-block; }

/* STATS */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.stat-box {
  background: #181818;
  border: 1px solid #2a2a2a;
  border-radius: 10px;
  padding: 14px 12px;
  text-align: center;
}
.stat-num {
  font-family: 'Syne', sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--accent);
  display: block;
}
.stat-label { font-size: .75rem; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }

/* CONTROLS */
.control-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.control-label {
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: #666;
  font-weight: 600;
}
.control-input {
  background: #111;
  border: 1.5px solid #333;
  border-radius: 8px;
  color: var(--paper);
  padding: 10px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: .9rem;
  width: 100%;
  outline: none;
  transition: border-color .2s;
}
.control-input:focus { border-color: var(--accent); }

.btn-parse {
  width: 100%;
  padding: 15px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .01em;
}
.btn-parse:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(230,60,47,.3); }
.btn-parse:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }

.btn-export {
  width: 100%;
  padding: 13px;
  background: transparent;
  color: var(--paper);
  border: 1.5px solid #333;
  border-radius: 10px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  font-size: .9rem;
  cursor: pointer;
  transition: all .2s;
}
.btn-export:hover { border-color: var(--paper); }
.btn-export:disabled { opacity: .3; cursor: default; }

.sidebar-section-title {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: .8rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: #555;
  padding-bottom: 8px;
  border-bottom: 1px solid #222;
}

/* STATUS */
.status-msg {
  font-size: .82rem;
  padding: 10px 14px;
  border-radius: 8px;
  display: none;
  font-weight: 500;
}
.status-msg.info { background: #0f2040; color: #7eb8ff; display: block; }
.status-msg.success { background: #0a2218; color: #4ade80; display: block; }
.status-msg.error { background: #2a0a08; color: #f87171; display: block; }

/* MAIN */
.main {
  padding: 40px 44px;
  background: var(--paper);
  overflow-y: auto;
}

.main-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 12px;
}

.main-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -.02em;
}

.filter-tabs {
  display: flex;
  gap: 8px;
}
.filter-tab {
  padding: 7px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--muted);
  transition: .15s;
}
.filter-tab.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

/* QUESTION CARDS */
.questions-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.q-card {
  background: var(--paper);
  border: 1.5px solid var(--border);
  border-radius: var(--card-radius);
  overflow: hidden;
  transition: box-shadow .2s;
}
.q-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.08); }

.q-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px 0;
}

.q-num {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: .8rem;
  background: var(--ink);
  color: var(--paper);
  padding: 3px 10px;
  border-radius: 4px;
  letter-spacing: .04em;
}

.q-type-badge {
  font-size: .75rem;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 4px;
  letter-spacing: .04em;
}
.q-type-badge.mcq { background: #dbeafe; color: var(--accent2); }
.q-type-badge.tf { background: #fef3c7; color: #92400e; }
.q-type-badge.short { background: #f0fdf4; color: var(--success); }

.q-edit-btn {
  margin-left: auto;
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: .78rem;
  cursor: pointer;
  color: var(--muted);
  transition: .15s;
  font-family: 'DM Sans', sans-serif;
}
.q-edit-btn:hover { border-color: var(--ink); color: var(--ink); }

.q-body { padding: 14px 20px 18px; }

.q-text {
  font-weight: 600;
  line-height: 1.65;
  font-size: .97rem;
  margin-bottom: 14px;
  color: var(--ink);
}

.q-context {
  background: var(--cream);
  border-left: 3px solid var(--gold);
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
  margin-bottom: 14px;
  font-size: .88rem;
  line-height: 1.7;
  color: #3a3830;
  font-style: italic;
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.option-item {
  padding: 10px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  font-size: .88rem;
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.4;
}
.option-item.correct {
  background: #f0fdf4;
  border-color: #86efac;
  font-weight: 700;
  color: var(--success);
}
.option-letter {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: .8rem;
  min-width: 20px;
}

.tf-items { display: flex; flex-direction: column; gap: 8px; }
.tf-item {
  padding: 10px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  font-size: .88rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.tf-label {
  font-size: .78rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: .03em;
}
.tf-label.true { background: #dcfce7; color: #15803d; }
.tf-label.false { background: #fee2e2; color: #dc2626; }

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 80px 40px;
  color: var(--muted);
}
.empty-icon { font-size: 3.5rem; margin-bottom: 16px; opacity: .4; }
.empty-state h3 { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 700; color: #ccc; margin-bottom: 8px; }
.empty-state p { font-size: .9rem; }

/* EDITABLE */
.q-text[contenteditable="true"],
.tf-item span[contenteditable="true"] {
  outline: 1px dashed var(--accent2);
  border-radius: 3px;
  padding: 0 2px;
}

/* ANSWER TOGGLE */
.answer-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: .82rem;
  color: var(--muted);
}
.answer-toggle select {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: .82rem;
  outline: none;
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
}

/* DELETE */
.del-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #ccc;
  font-size: 1rem;
  transition: color .15s;
  padding: 2px 6px;
}
.del-btn:hover { color: var(--accent); }

@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .main { padding: 24px 20px; }
  .options-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div>
    <div class="logo">Quiz<span>Parse</span></div>
    <div class="logo-sub">Phân tích đề thi tự động</div>
  </div>

  <div>
    <div class="sidebar-section-title" style="margin-bottom:12px">Tải lên đề thi</div>
    <div class="upload-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".txt,.docx,.doc" onchange="handleFile(this)">
      <div class="upload-icon-big">📂</div>
      <p>Kéo thả hoặc <strong>nhấn chọn file</strong></p>
      <p style="margin-top:6px;font-size:.78rem;">.txt · .docx · .doc</p>
      <div class="file-badge" id="fileBadge">—</div>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="control-group">
    <div class="sidebar-section-title">Thông tin đề thi</div>
    <label class="control-label">Tên đề thi</label>
    <input class="control-input" id="quizTitle" value="Ôn Tập" placeholder="VD: Lịch Sử 10A">
    <label class="control-label">Thời gian (phút)</label>
    <input class="control-input" type="number" id="quizTime" value="60" min="5" max="180">
  </div>

  <div class="stats-grid" id="statsGrid" style="display:none">
    <div class="stat-box"><span class="stat-num" id="statTotal">0</span><span class="stat-label">Tổng câu</span></div>
    <div class="stat-box"><span class="stat-num" id="statMCQ">0</span><span class="stat-label">Trắc nghiệm</span></div>
    <div class="stat-box"><span class="stat-num" id="statTF">0</span><span class="stat-label">Đúng/Sai</span></div>
    <div class="stat-box"><span class="stat-num" id="statShort">0</span><span class="stat-label">Khác</span></div>
  </div>

  <div class="control-group">
    <button class="btn-parse" id="parseBtn" onclick="parseContent()" disabled>⚡ Phân tích đề thi</button>
    <button class="btn-export" id="exportBtn" onclick="exportQuiz()" disabled>📤 Xuất file quiz (.html)</button>
  </div>
</aside>

<!-- MAIN PANEL -->
<main class="main">
  <div class="main-header">
    <div class="main-title" id="mainTitle">Kết quả phân tích</div>
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterBy('all',this)">Tất cả</button>
      <button class="filter-tab" onclick="filterBy('mcq',this)">Trắc nghiệm</button>
      <button class="filter-tab" onclick="filterBy('tf',this)">Đúng/Sai</button>
    </div>
  </div>

  <div id="questionList" class="questions-list">
    <div class="empty-state">
      <div class="empty-icon">📄</div>
      <h3>Chưa có đề thi nào</h3>
      <p>Upload file .txt hoặc .docx rồi nhấn "Phân tích" để bắt đầu</p>
    </div>
  </div>
</main>

</div>

<script>
let rawText = '';
let parsedQuestions = [];
let activeFilter = 'all';

// ────────────────────────── FILE HANDLING ──────────────────────────

window.onload = () => {
  const zone = document.getElementById('dropZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag');
    if(e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
  });
};

function handleFile(input) { if(input.files[0]) processFile(input.files[0]); }

async function processFile(file) {
  showStatus('Đang đọc file...', 'info');
  const badge = document.getElementById('fileBadge');
  badge.textContent = '📎 ' + file.name;
  badge.classList.add('show');

  try {
    if(file.name.endsWith('.txt')) {
      rawText = await file.text();
    } else if(file.name.match(/\.docx?$/i)) {
      const ab = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: ab });
      rawText = result.value;
    } else {
      showStatus('❌ Chỉ hỗ trợ .txt và .docx', 'error'); return;
    }
    showStatus(`✅ Đã tải: ${file.name} (${rawText.length} ký tự)`, 'success');
    document.getElementById('parseBtn').disabled = false;
  } catch(e) {
    showStatus('❌ Lỗi đọc file: ' + e.message, 'error');
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}

// ────────────────────────── PARSER ENGINE ──────────────────────────

function parseContent() {
  if(!rawText) return;
  parsedQuestions = [];

  const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  
  // Strategy: find question boundaries, then parse each block
  const blocks = splitIntoQuestionBlocks(lines);
  
  for(const block of blocks) {
    const q = parseBlock(block);
    if(q) parsedQuestions.push(q);
  }

  if(parsedQuestions.length === 0) {
    showStatus('⚠️ Không tìm thấy câu hỏi. Kiểm tra định dạng file.', 'error');
    return;
  }

  updateStats();
  renderQuestions();
  document.getElementById('exportBtn').disabled = false;
  showStatus(`✅ Phân tích xong: ${parsedQuestions.length} câu hỏi`, 'success');
}

// ── Split entire text into per-question blocks ──
function splitIntoQuestionBlocks(lines) {
  // Patterns that start a new question
  const qStartRe = /^(câu\s*\d+|question\s*\d+|\d+[\.\)]\s)/i;
  const blocks = [];
  let current = [];

  for(const line of lines) {
    if(qStartRe.test(line) && current.length > 0) {
      blocks.push(current);
      current = [line];
    } else {
      current.push(line);
    }
  }
  if(current.length > 0) blocks.push(current);
  return blocks;
}

// ── Parse a single block into question object ──
function parseBlock(block) {
  if(block.length === 0) return null;

  const text = block.join('\n');

  // Detect type
  const isTF = detectTFQuestion(block);
  
  if(isTF) return parseTFBlock(block);
  
  const mcq = parseMCQBlock(block);
  if(mcq && mcq.options.length >= 2) return mcq;

  // Fallback: treat as generic question
  const questionLine = block[0];
  if(questionLine.length > 5) {
    return {
      type: 'short',
      question: cleanQuestion(questionLine),
      note: block.slice(1).join(' ')
    };
  }
  return null;
}

function detectTFQuestion(block) {
  const text = block.join('\n').toLowerCase();
  const hasTFMarkers = /\b(đúng|sai|true|false)\b/.test(text);
  const hasSubItems = block.filter(l => /^[a-d]\s*[\)\.]/.test(l.toLowerCase())).length >= 2;
  const hasTFPhrase = /đúng hay sai|đúng\/sai|đ\/s|đánh dấu x|(a\)|b\)|c\)|d\))/i.test(text);
  return (hasTFMarkers && hasSubItems) || hasTFPhrase;
}

// ── Parse MCQ ──
function parseMCQBlock(block) {
  let questionLines = [];
  let options = [];
  let answerIndex = -1;
  let contextLines = [];
  let inContext = false;

  const optionRe = /^([A-D])\s*[\.\)]\s*(.+)/i;
  const answerRe = /^(đáp án|answer|đ[aá]p [aá]n|Đ[aA])\s*[:.\-]?\s*([A-D])/i;

  for(const line of block) {
    if(answerRe.test(line)) {
      const m = line.match(answerRe);
      answerIndex = 'ABCD'.indexOf(m[2].toUpperCase());
      continue;
    }
    if(optionRe.test(line)) {
      const m = line.match(optionRe);
      options.push({ letter: m[1].toUpperCase(), text: m[2].trim() });
      inContext = false;
      continue;
    }
    // Context / passage
    if(options.length === 0 && /tư liệu|đoạn văn|đoạn trích|passage/i.test(line)) {
      inContext = true;
    }
    if(inContext) { contextLines.push(line); continue; }
    questionLines.push(line);
  }

  // Try to infer answer from (bold, asterisk, or parenthesis markers)
  if(answerIndex === -1) {
    options.forEach((opt, i) => {
      if(/\*|##|\[x\]|\(x\)/i.test(opt.text)) { answerIndex = i; opt.text = opt.text.replace(/\*|##|\[x\]|\(x\)/gi,'').trim(); }
    });
  }

  const questionText = questionLines.join(' ').trim();
  if(!questionText && contextLines.length === 0) return null;

  return {
    type: 'mcq',
    question: cleanQuestion(questionText || contextLines[0] || block[0]),
    context: contextLines.length > 0 ? contextLines.join('\n') : null,
    options: options.map(o => `${o.letter}. ${o.text}`),
    answer: answerIndex
  };
}

// ── Parse True/False block ──
function parseTFBlock(block) {
  const statements = [];
  let questionLines = [];
  let contextLines = [];
  let inContext = false;

  const stmtRe = /^([a-d])\s*[\)\.](.+)/i;
  const answerRe = /^(đáp án|answer)\s*[:.\-]?\s*(.+)/i;
  const tfInlineRe = /\((đúng|sai|true|false|[ĐD]|[Ss])\)/i;

  for(const line of block) {
    if(answerRe.test(line)) continue;

    if(stmtRe.test(line)) {
      const m = line.match(stmtRe);
      let txt = m[2].trim();
      let answer = null;

      // Detect answer inline e.g. "(Đúng)" or "(S)"
      const am = txt.match(tfInlineRe);
      if(am) {
        const av = am[1].toLowerCase();
        answer = av === 'đúng' || av === 'true' || av === 'đ' || av === 'd';
        txt = txt.replace(tfInlineRe, '').trim();
      }
      statements.push({ text: `${m[1].toLowerCase()}) ${txt}`, answer });
      inContext = false;
      continue;
    }

    if(/tư liệu|đoạn văn|đoạn trích/i.test(line)) { inContext = true; }
    if(inContext) { contextLines.push(line); continue; }
    if(statements.length === 0) questionLines.push(line);
  }

  if(statements.length === 0) return null;

  // Fill null answers with false if not detected
  statements.forEach(s => { if(s.answer === null) s.answer = false; });

  return {
    type: 'tf',
    question: cleanQuestion(questionLines.join(' ') || block[0]),
    context: contextLines.length > 0 ? contextLines.join('\n') : null,
    statements
  };
}

function cleanQuestion(str) {
  // Remove leading "Câu X." or "1." prefix for clean display
  return str.replace(/^(câu\s*\d+|question\s*\d+|\d+[\.\)])\s*/i, '').trim();
}

// ────────────────────────── RENDER ──────────────────────────

function updateStats() {
  const mcq = parsedQuestions.filter(q => q.type === 'mcq').length;
  const tf  = parsedQuestions.filter(q => q.type === 'tf').length;
  const sh  = parsedQuestions.filter(q => q.type === 'short').length;
  document.getElementById('statTotal').textContent = parsedQuestions.length;
  document.getElementById('statMCQ').textContent = mcq;
  document.getElementById('statTF').textContent = tf;
  document.getElementById('statShort').textContent = sh;
  document.getElementById('statsGrid').style.display = 'grid';
}

function filterBy(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderQuestions();
}

function renderQuestions() {
  const container = document.getElementById('questionList');
  const visible = parsedQuestions.filter(q => activeFilter === 'all' || q.type === activeFilter);

  if(visible.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><h3>Không có câu hỏi</h3><p>Thử chọn bộ lọc khác</p></div>`;
    return;
  }

  let globalIdx = 0;
  container.innerHTML = visible.map(q => {
    const realIdx = parsedQuestions.indexOf(q);
    return renderCard(q, realIdx, ++globalIdx);
  }).join('');
}

function renderCard(q, realIdx, displayNum) {
  const typeMap = { mcq: ['MCQ','mcq'], tf: ['Đúng/Sai','tf'], short: ['Khác','short'] };
  const [typeLabel, typeCls] = typeMap[q.type] || ['?',''];

  let bodyHTML = `<div class="q-text" id="qtext-${realIdx}" contenteditable="false">${q.question || '(chưa có tiêu đề)'}</div>`;

  if(q.context) {
    bodyHTML += `<div class="q-context">${q.context.replace(/\n/g,'<br>')}</div>`;
  }

  if(q.type === 'mcq') {
    bodyHTML += `<div class="options-grid">`;
    q.options.forEach((opt, i) => {
      const correct = i === q.answer;
      bodyHTML += `<div class="option-item ${correct ? 'correct' : ''}">
        <span class="option-letter">${'ABCD'[i]}</span>
        <span>${opt.replace(/^[A-D][\.\)]\s*/,'')}</span>
        ${correct ? '✓' : ''}
      </div>`;
    });
    bodyHTML += `</div>`;
    if(q.answer >= 0) {
      bodyHTML += `<div class="answer-toggle">
        <span>Đáp án đúng:</span>
        <select onchange="changeAnswer(${realIdx},this.value)">
          ${['A','B','C','D'].map((l,i)=>`<option value="${i}" ${i===q.answer?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>`;
    }
  }

  if(q.type === 'tf') {
    bodyHTML += `<div class="tf-items">`;
    q.statements.forEach((s, si) => {
      bodyHTML += `<div class="tf-item">
        <span>${s.text}</span>
        <select onchange="changeTFAnswer(${realIdx},${si},this.value)">
          <option value="true" ${s.answer===true?'selected':''}>✓ Đúng</option>
          <option value="false" ${s.answer===false?'selected':''}>✗ Sai</option>
        </select>
      </div>`;
    });
    bodyHTML += `</div>`;
  }

  if(q.type === 'short') {
    bodyHTML += `<div style="font-size:.85rem;color:var(--muted);padding:8px 0;">${q.note || ''}</div>`;
  }

  return `
  <div class="q-card" id="card-${realIdx}">
    <div class="q-header">
      <span class="q-num">Câu ${displayNum}</span>
      <span class="q-type-badge ${typeCls}">${typeLabel}</span>
      <button class="q-edit-btn" onclick="toggleEdit(${realIdx})">✏️ Sửa</button>
      <button class="del-btn" onclick="deleteQ(${realIdx})" title="Xóa">✕</button>
    </div>
    <div class="q-body">${bodyHTML}</div>
  </div>`;
}

function toggleEdit(idx) {
  const el = document.getElementById(`qtext-${idx}`);
  if(el) {
    const editing = el.contentEditable === 'true';
    el.contentEditable = editing ? 'false' : 'true';
    if(!editing) el.focus();
    else parsedQuestions[idx].question = el.textContent.trim();
  }
}

function changeAnswer(idx, val) { parsedQuestions[idx].answer = parseInt(val); renderQuestions(); }
function changeTFAnswer(idx, si, val) { parsedQuestions[idx].statements[si].answer = val === 'true'; }
function deleteQ(idx) { parsedQuestions.splice(idx,1); updateStats(); renderQuestions(); }

// ────────────────────────── EXPORT ──────────────────────────

function exportQuiz() {
  if(parsedQuestions.length === 0) return;
  const title = document.getElementById('quizTitle').value || 'Ôn Tập';
  const timeMin = parseInt(document.getElementById('quizTime').value) || 60;

  // Sync any edited text
  parsedQuestions.forEach((q, i) => {
    const el = document.getElementById(`qtext-${i}`);
    if(el) q.question = el.textContent.trim();
  });

  const mcqCount = parsedQuestions.filter(q => q.type === 'mcq').length;
  const tfCount  = parsedQuestions.filter(q => q.type === 'tf').length;
  const html = buildQuizHTML(parsedQuestions, title, timeMin * 60, mcqCount, tfCount);

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = title.replace(/\s+/g,'_') + '_quiz.html';
  a.click(); URL.revokeObjectURL(url);
}

// ────────────────────────── QUIZ OUTPUT BUILDER ──────────────────────────

function buildQuizHTML(quizData, title, timeLeft, mcqCount, tfCount) {
  const totalCount = quizData.length;
  const timeMinutes = Math.round(timeLeft / 60);
  // Only export MCQ and TF
  const exportData = quizData.filter(q => q.type === 'mcq' || q.type === 'tf');
  const dataJSON = JSON.stringify(exportData);

  return `<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title}</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--bg:#eef4ff;--surface:#fff;--text:#0f172a;--text2:#64748b;--border:#dbe3f0;--success:#16a34a;--danger:#dc2626;--radius:16px;--font:'Be Vietnam Pro',sans-serif;}
[data-theme=dark]{--bg:#0f172a;--surface:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--border:#334155;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--text);padding:0;}
.screen{display:none;}.screen.active{display:block;}
.card{max-width:700px;margin:0 auto;padding:24px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.07);}
.wrap{padding:20px;}
.title{font-size:1.9rem;font-weight:800;text-align:center;color:var(--primary);margin-bottom:8px;}
.sub{text-align:center;color:var(--text2);margin-bottom:24px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0 24px;}
.box{background:#f8fafc;border:1px solid var(--border);padding:16px;border-radius:12px;text-align:center;}
.box .n{font-size:1.7rem;font-weight:800;color:var(--primary);}
.btn{border:none;cursor:pointer;padding:13px 16px;border-radius:12px;font-weight:700;transition:.2s;font-family:var(--font);font-size:.95rem;}
.btn:hover{transform:translateY(-2px);}
.btn-p{background:var(--primary);color:#fff;}
.btn-s{background:#e2e8f0;color:var(--text);}
.btn-g{background:var(--success);color:#fff;}
.prog{height:10px;background:#dbe3f0;border-radius:999px;overflow:hidden;margin-bottom:14px;}
.prog div{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);width:0%;transition:.3s;}
.hdr{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px;font-weight:600;}
.question{font-size:1.05rem;font-weight:700;line-height:1.7;margin-bottom:18px;}
.opt{width:100%;text-align:left;padding:14px;border-radius:12px;border:2px solid var(--border);background:var(--surface);margin-bottom:10px;cursor:pointer;font-size:.95rem;transition:.2s;color:var(--text);}
.opt:hover{border-color:var(--primary);}
.opt.correct{background:#dcfce7;border-color:var(--success);}
.opt.wrong{background:#fee2e2;border-color:var(--danger);}
.ctx{padding:12px 16px;background:#f8f7f2;border-left:4px solid #c8973a;border-radius:0 8px 8px 0;margin-bottom:16px;line-height:1.7;font-size:.92rem;font-style:italic;}
.nav{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}.nav .btn{flex:1;}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}.quick button{width:38px;height:38px;border-radius:8px;border:none;font-weight:700;cursor:pointer;}
.rev{padding:14px;border-radius:12px;margin-bottom:12px;border-left:5px solid var(--border);background:#f8fafc;}
.rev.c{border-color:var(--success);}.rev.w{border-color:var(--danger);}
.res-bar{height:18px;background:#dbe3f0;border-radius:999px;overflow:hidden;margin-top:18px;}
.res-bar div{height:100%;background:linear-gradient(90deg,#22c55e,#3b82f6);width:0%;transition:.6s;}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0;}
.mode-c{padding:18px;border-radius:14px;border:2px solid var(--border);text-align:center;cursor:pointer;transition:.2s;}
.mode-c.sel{border-color:var(--primary);background:#dbeafe;}
.tf-s{border:2px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.tf-s .txt{font-weight:600;line-height:1.6;margin-bottom:10px;}
.tf-row{display:flex;gap:8px;}
.tf-b{flex:1;padding:9px;border-radius:8px;border:2px solid var(--border);background:var(--surface);font-weight:700;cursor:pointer;font-size:.9rem;transition:.2s;color:var(--text);}
.tf-b:hover:not(:disabled){transform:translateY(-1px);}
.tf-b.st{background:#dcfce7;border-color:var(--success);color:var(--success);}
.tf-b.sf{background:#fee2e2;border-color:var(--danger);color:var(--danger);}
.tf-b:disabled{opacity:.7;cursor:default;transform:none;}
.tf-s.ac{border-color:var(--success);background:#f0fdf4;}
.tf-s.aw{border-color:var(--danger);background:#fff1f2;}
.hint{margin-top:6px;font-size:.85rem;font-weight:600;}
</style>
</head>
<body>
<div id="s-welcome" class="screen active"><div class="wrap"><div class="card">
<div class="title">📚 ${title}</div>
<div class="sub">Hệ thống luyện đề</div>
<div class="grid">
<div class="box"><div class="n">${exportData.length}</div>Tổng câu</div>
<div class="box"><div class="n">${exportData.filter(q=>q.type==='mcq').length}</div>Trắc nghiệm</div>
<div class="box"><div class="n">${exportData.filter(q=>q.type==='tf').length}</div>Đúng/Sai</div>
<div class="box"><div class="n">${timeMinutes}'</div>Thời gian</div>
</div>
<button class="btn btn-p" style="width:100%" onclick="go('s-mode')">Bắt đầu →</button>
</div></div></div>

<div id="s-mode" class="screen"><div class="wrap"><div class="card">
<div class="title">⚙️ Chế độ làm bài</div>
<div class="mode-grid">
<div class="mode-c sel" data-mode="both" onclick="pickMode(this)"><h3>Tất cả</h3><p>${exportData.length} câu</p></div>
${exportData.filter(q=>q.type==='mcq').length>0?`<div class="mode-c" data-mode="mcq" onclick="pickMode(this)"><h3>Trắc nghiệm</h3><p>${exportData.filter(q=>q.type==='mcq').length} câu</p></div>`:''}
${exportData.filter(q=>q.type==='tf').length>0?`<div class="mode-c" data-mode="tf" onclick="pickMode(this)"><h3>Đúng/Sai</h3><p>${exportData.filter(q=>q.type==='tf').length} câu</p></div>`:''}
</div>
<div style="margin:16px 0"><label style="font-size:.85rem;font-weight:700;color:var(--text2);">Thứ tự</label>
<select id="order" style="width:100%;padding:12px;border-radius:10px;margin-top:8px;font-family:var(--font);">
<option value="mix">Ngẫu nhiên</option><option value="seq">Tuần tự</option>
</select></div>
<div style="margin:12px 0"><button class="btn btn-s" onclick="toggleDark()">🌙 Dark Mode</button></div>
<div class="nav">
<button class="btn btn-s" onclick="go('s-welcome')">Quay lại</button>
<button class="btn btn-p" onclick="startQuiz()">Làm bài</button>
</div></div></div></div>

<div id="s-quiz" class="screen"><div class="wrap"><div class="card">
<div class="prog"><div id="bar"></div></div>
<div class="hdr"><span id="pText"></span><span id="tmr">--:--</span><span id="scr">0đ</span></div>
<div class="quick" id="quick"></div>
<div class="question" id="qtext"></div>
<div id="qctx"></div>
<div id="opts"></div>
<div class="nav">
<button class="btn btn-s" onclick="prevQ()">← Trước</button>
<button class="btn btn-p" onclick="nextQ()">Tiếp →</button>
</div></div></div></div>

<div id="s-result" class="screen"><div class="wrap"><div class="card">
<div class="title">🎯 Kết quả</div>
<h1 id="fscore" style="text-align:center;font-size:3.5rem;margin:18px 0;color:var(--primary)">0%</h1>
<div class="grid">
<div class="box"><div class="n" id="rc">0</div>Đúng</div>
<div class="box"><div class="n" id="wc">0</div>Sai</div>
<div class="box"><div class="n" id="sk">0</div>Bỏ qua</div>
</div>
<div class="res-bar"><div id="rfill"></div></div>
<h2 id="rank" style="text-align:center;margin-top:14px;"></h2>
<div class="nav">
<button class="btn btn-s" onclick="buildRev();go('s-review')">Xem đáp án</button>
<button class="btn btn-g" onclick="restart()">Làm lại</button>
</div></div></div></div>

<div id="s-review" class="screen"><div class="wrap"><div class="card">
<div class="title">🔍 Đáp án</div>
<div id="revList"></div>
<div class="nav"><button class="btn btn-p" onclick="go('s-result')">Quay lại</button></div>
</div></div></div>

<script>
const D=${dataJSON};
let mode='both',qs=[],cur=0,ans=[],sc=0,tmr,tl=${timeLeft};
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0);}
function toggleDark(){document.body.dataset.theme=document.body.dataset.theme==='dark'?'':'dark';}
function pickMode(el){document.querySelectorAll('.mode-c').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');mode=el.dataset.mode;}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shufMCQ(q){if(q.type!=='mcq')return q;const m=q.options.map((x,i)=>({t:x,i}));shuf(m);q.options=m.map(x=>x.t);q.answer=m.findIndex(x=>x.i===q.answer);return q;}
function startQuiz(){
  qs=D.filter(q=>mode==='both'||q.type===mode);
  if(document.getElementById('order').value==='mix')shuf(qs);
  qs=qs.map(q=>shufMCQ(JSON.parse(JSON.stringify(q))));
  cur=0;sc=0;ans=new Array(qs.length).fill(null);tl=${timeLeft};startTimer();go('s-quiz');render();
}
function startTimer(){
  clearInterval(tmr);
  tmr=setInterval(()=>{tl--;
    const m=String(Math.floor(tl/60)).padStart(2,'0'),s=String(tl%60).padStart(2,'0');
    document.getElementById('tmr').textContent='⏰ '+m+':'+s;
    if(tl<=0)showRes();
  },1000);
}
function render(){
  const q=qs[cur];
  document.getElementById('bar').style.width=((cur+1)/qs.length*100)+'%';
  document.getElementById('pText').textContent='Câu '+(cur+1)+'/'+qs.length;
  document.getElementById('scr').textContent=sc+'đ';
  document.getElementById('qtext').textContent=q.question;
  const cx=document.getElementById('qctx');cx.innerHTML='';
  if(q.context)cx.innerHTML='<div class="ctx">'+q.context+'</div>';
  const ob=document.getElementById('opts');ob.innerHTML='';
  if(q.type==='mcq')rMCQ(q,ob);else rTF(q,ob);
  bQuick();
}
function rMCQ(q,b){q.options.forEach((o,i)=>{const btn=document.createElement('button');btn.className='opt';btn.textContent=o;if(ans[cur]!==null){btn.disabled=true;if(i===q.answer)btn.classList.add('correct');if(i===ans[cur]&&i!==q.answer)btn.classList.add('wrong');}btn.onclick=()=>{if(ans[cur]!==null)return;ans[cur]=i;if(i===q.answer)sc++;render();};b.appendChild(btn);});}
function rTF(q,b){
  const ca=ans[cur]||{},tot=q.statements.length,done=Object.keys(ca).length,all=done===tot;
  q.statements.forEach((s,i)=>{
    const w=document.createElement('div');w.className='tf-s';
    if(all)w.classList.add(ca[i]===s.answer?'ac':'aw');
    const t=document.createElement('div');t.className='txt';t.textContent=s.text;w.appendChild(t);
    const r=document.createElement('div');r.className='tf-row';
    const tb=document.createElement('button');tb.className='tf-b';tb.textContent='✓ Đúng';
    const fb=document.createElement('button');fb.className='tf-b';fb.textContent='✗ Sai';
    if(ca[i]!==undefined){tb.disabled=fb.disabled=true;if(ca[i]===true)tb.classList.add('st');if(ca[i]===false)fb.classList.add('sf');}
    tb.onclick=()=>aTF(i,true);fb.onclick=()=>aTF(i,false);
    r.appendChild(tb);r.appendChild(fb);w.appendChild(r);
    if(all){const h=document.createElement('div');h.className='hint';const ok=ca[i]===s.answer;h.style.color=ok?'var(--success)':'var(--danger)';h.textContent=ok?'✓ Đáp án: '+(s.answer?'Đúng':'Sai'):'✗ Đáp án đúng: '+(s.answer?'Đúng':'Sai');w.appendChild(h);}
    b.appendChild(w);
  });
  const pg=document.createElement('div');pg.style.cssText='margin-top:10px;padding:8px 12px;background:#f1f5f9;border-radius:8px;font-size:.85rem;color:var(--text2);font-weight:600;';
  pg.textContent=done===tot?'✅ Hoàn thành':'Đã trả lời '+done+'/'+tot+' ý';b.appendChild(pg);
}
function aTF(idx,v){const q=qs[cur];if(ans[cur]===null)ans[cur]={};if(ans[cur][idx]!==undefined)return;ans[cur][idx]=v;const done=Object.keys(ans[cur]).length;if(done===q.statements.length){let ok=true;q.statements.forEach((s,i)=>{if(ans[cur][i]!==s.answer)ok=false;});if(ok)sc++;document.getElementById('scr').textContent=sc+'đ';}render();}
function nextQ(){if(cur<qs.length-1){cur++;render();}else showRes();}
function prevQ(){if(cur>0){cur--;render();}}
function bQuick(){const qk=document.getElementById('quick');qk.innerHTML='';qs.forEach((x,i)=>{const b=document.createElement('button');b.textContent=i+1;if(i===cur)b.style.border='3px solid #2563eb';const done=x.type==='mcq'?ans[i]!==null:(ans[i]!==null&&Object.keys(ans[i]).length===x.statements.length);if(done)b.style.background='#22c55e';else if(ans[i])b.style.background='#fbbf24';b.onclick=()=>{cur=i;render();};qk.appendChild(b);});}
function showRes(){clearInterval(tmr);let c=0,w=0,sk=0;qs.forEach((q,i)=>{if(q.type==='mcq'){if(ans[i]===null){sk++;return;}ans[i]===q.answer?c++:w++;}else{if(!ans[i]||!Object.keys(ans[i]).length){sk++;return;}let ok=true;q.statements.forEach((s,si)=>{if(ans[i][si]!==s.answer)ok=false;});ok?c++:w++;}});const p=Math.round(c/qs.length*100);document.getElementById('fscore').textContent=p+'%';document.getElementById('rc').textContent=c;document.getElementById('wc').textContent=w;document.getElementById('sk').textContent=sk;document.getElementById('rfill').style.width=p+'%';document.getElementById('rank').textContent=p>=90?'🌟 Xuất sắc':p>=75?'🔥 Giỏi':p>=60?'👍 Khá':p>=40?'⚠️ Trung bình':'❌ Cần ôn thêm';go('s-result');}
function buildRev(){const l=document.getElementById('revList');l.innerHTML='';qs.forEach((q,i)=>{const d=document.createElement('div');let ok=false;if(q.type==='mcq')ok=ans[i]===q.answer;if(q.type==='tf'&&ans[i]){ok=true;q.statements.forEach((s,si)=>{if(ans[i][si]!==s.answer)ok=false;});}d.className='rev '+(ok?'c':'w');let h='<h3 style="margin-bottom:8px;">'+(i+1)+'. '+q.question+'</h3>';if(q.type==='mcq'){h+='<p><b>Bạn chọn:</b> '+(ans[i]!=null?q.options[ans[i]]:'Chưa TL')+'</p><p><b>Đúng:</b> '+q.options[q.answer]+'</p>';}else{q.statements.forEach((s,si)=>{const uA=ans[i]?ans[i][si]:undefined,ck=uA===s.answer;h+='<p style="margin-top:6px;">'+s.text+' → <b style="color:'+(ck?'var(--success)':'var(--danger)')+'">'+( s.answer?'Đúng':'Sai')+(uA!==undefined?' | Bạn: '+(uA?'Đúng':'Sai'):' | Chưa TL')+'</b></p>';});}d.innerHTML=h;l.appendChild(d);});}
function restart(){go('s-mode');}
<\/script>
</body>
</html>`;
}
</script>
</body>
</html>
