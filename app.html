<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" type="image/x-icon" href="ORC.ico">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ORC Studio - Apps Store</title>

    <style>
        :root {
            --gura-blue: #99CCFF;
            --gura-dark: #0a0e14;
            --gura-accent: #3399FF;
            --gura-gray: #2a2f3a;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--gura-dark);
            color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column;
            animation: grid-move 10s linear infinite;

        }
        @keyframes grid-move {
            from { background-position: 0 0; }
            to { background-position: 40px 40px; }
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* Ảnh mặc định khi chưa load xong Firebase */
            background-color: var(--gura-dark);
            z-index: -1;
            transition: background 0.5s ease, background-color 0.5s ease;
        }

        /* Giữ nguyên các Style cũ của Orichiin-san */
        .pure-nav {
            height: 60px; background: rgba(0, 0, 0, 0.7);
            display: flex; align-items: center; justify-content: center;
            border-bottom: 2px solid var(--gura-blue); width: 100%;
        }
        .back-btn {
            align-self: flex-start; margin-bottom: 20px;
            color: #99CCFF; text-decoration: none; font-weight: bold;
            display: flex; align-items: center; gap: 8px;
            transition: 0.3s;
        }
        .back-btn:hover { color: white; transform: translateX(-5px); }
        .wrapper { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .section-title { color: var(--gura-blue); font-size: 2rem; font-weight: bold; margin-bottom: 30px; text-shadow: 0 0 15px rgba(153, 204, 255, 0.5); }
        .app-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; width: 100%; max-width: 900px; }
        .app-card { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(153, 204, 255, 0.3); border-radius: 20px; padding: 25px; text-align: center; transition: 0.3s; backdrop-filter: blur(10px); }
        .app-card:hover { background: rgba(153, 204, 255, 0.1); transform: translateY(-10px); border-color: var(--gura-blue); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .app-icon { width: 90px; height: 90px; margin-bottom: 15px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .app-name { font-weight: bold; font-size: 1.3rem; margin: 10px 0; color: white; }
        .app-desc { font-size: 0.9rem; color: #ccc; margin-bottom: 20px; line-height: 1.4; }
        .app-buttons { display: flex; gap: 12px; }
        .btn-app-view, .btn-app-dl { padding: 12px; border-radius: 10px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: 0.2s; flex: 1; text-transform: uppercase; }
        .btn-app-view { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-app-dl { background: linear-gradient(45deg, var(--gura-accent), #0072ff); color: white; }
        .btn-app-dl-none { background: linear-gradient(45deg, var(--gura-gray), #63778f); color: rgb(92, 91, 91); }
        #preview-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 20000; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        #preview-img { max-width: 85%; max-height: 80%; border-radius: 15px; border: 2px solid var(--gura-blue); box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        #popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10001; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        #main-popup { width: 90%; max-width: 500px; min-height: 300px; border-radius: 30px; position: relative; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 1px solid var(--gura-blue); }
        .asus-wave-container {
            position: fixed; width: 100%; height: 15vh; bottom: 0; left: 0;
            z-index: 1; pointer-events: none;
        }
        .waves { position: relative; width: 100%; height: 100%; }
        .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
        .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
        .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
        .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }
        @keyframes move-forever {
            0% { transform: translate3d(-90px,0,0); }
            100% { transform: translate3d(85px,0,0); }
        }
        .container { min-height: 100vh; padding-top: 100px; display: flex; flex-direction: column; align-items: center; background: rgba(0, 0, 0, 0.2); }
        .content-box { position: relative; z-index: 10; width: 90%; max-width: 600px; padding: 40px; border-radius: 25px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; transition: 0.3s; margin-bottom: 50px; }
        .content-box:hover { animation: neon-burn 1.5s infinite alternate ease-in-out; }
        .content-box-red { position: relative; z-index: 10; width: 90%; max-width: 600px; padding: 40px; border-radius: 25px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(15px); border: 1px solid rgba(70, 24, 24, 0.1); text-align: center; transition: 0.3s; margin-bottom: 50px; animation: neon-burn-red 1.5s infinite alternate ease-in-out; }
        .content-box-none { position: relative; z-index: 10; width: 90%; max-width: 600px; padding: 40px; border-radius: 25px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; transition: 0.3s; margin-bottom: 50px; }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>
    <div id="preview-overlay" onclick="this.style.display='none'">
        <img id="preview-img" src="">
        <p style="position:absolute; bottom:30px; color:#99CCFF; font-weight:bold;">BẤM ĐỂ ĐÓNG</p>
    </div>

    <div id="popup-overlay">
        <div id="main-popup">
            <button onclick="document.getElementById('popup-overlay').style.display='none'" style="position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.2); border: none; color: white; font-size: 24px; cursor: pointer; border-radius: 50%; width: 35px; height: 35px;">&times;</button>
            <div id="popup-text"></div>
        </div>
    </div>

    <nav class="pure-nav">
        <div style="font-weight: bold; color: var(--gura-blue); font-size: 1.2rem; letter-spacing: 2px;">ORICHIIN STUDIO 🦈</div>
    </nav>
    <div id="update-banner" style="background: rgba(153, 204, 255, 0.1); border-bottom: 1px solid var(--gura-accent); padding: 10px; text-align: center; font-size: 0.9rem; position: sticky; top: 60px; z-index: 999; backdrop-filter: blur(5px);">
        <span style="color: var(--gura-yellow); font-weight: bold;">CẬP NHẬT:</span> 
        <span id="update-content" style="color: #cbd5e0;">Đang kiểm tra thông tin...</span>
    </div>
    <a href="https://www.hentaiorc.xyz/list.html" class="back-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path></svg>
        QUAY LẠI TRANG CHỦ
    </a>
    <div class="wrapper">
        <div class="section-title">🚀 APPS COLLECTION</div>
        
        <div class="app-container">
            <div class="app-card">
                <img src="logo_orc.png" class="app-icon" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1055/1055683.png'">
                <div class="app-name">ORC Downloader</div>
                <div class="app-desc">Phần mềm tải video m3u8 chuyên dụng. Tốc độ cao, hỗ trợ ghép nối file tự động.</div>
                <div class="app-buttons">
                    <button class="btn-app-view" onclick="previewApp('https://i.imgur.com/your-screenshot-link.png')">Xem trước</button>
                    <button class="btn-app-dl" onclick="window.open('https://www.hentaiorc.xyz/fix_hls.pyw.exe')">Tải bản .exe</button>
                </div>
            </div>
            <div class="app-card">
                <img src="https://cdn-icons-png.flaticon.com/512/2522/2522649.png" class="app-icon">
                <div class="app-name">orc-download youtube</div>
                <div class="app-desc">Dự kiến sẽ có vào năm 2027</div>
                <div class="app-buttons">
                    <button class="btn-app-dl"></button>
                </div>
            </div>
        </div>
    </div>
    <div class="asus-wave-container">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use href="#gentle-wave" x="48" y="0" fill="rgba(0, 243, 255, 0.2)" />
                <use href="#gentle-wave" x="48" y="3" fill="rgba(0, 243, 255, 0.3)" />
                <use href="#gentle-wave" x="48" y="5" fill="rgba(0, 243, 255, 0.1)" />
                <use href="#gentle-wave" x="48" y="7" fill="rgba(0, 243, 255, 0.5)" />
            </g>
        </svg>
    </div>
    <script>
        function previewApp(imgUrl) {
            const overlay = document.getElementById('preview-overlay');
            const img = document.getElementById('preview-img');
            img.src = imgUrl;
            overlay.style.display = 'flex';
        }
        // Dán đoạn này vào bên trong thẻ <script> cuối trang
        async function fetchUpdateInfo() {
        // Thay link này bằng link file .txt thật của mình
            const updateFileUrl = 'https://www.hentaiorc.xyz/update.txt'; 
    
        try {
            // Thêm tham số ?v= để tránh trình duyệt lưu cache file cũ
                const response = await fetch(updateFileUrl + '?v=' + Date.now());
                if (!response.ok) throw new Error('Không tìm thấy file');
        
                const text = await response.text();
        
            // Hiển thị nội dung vào banner
                document.getElementById('update-content').innerText = text;
            } catch (error) {
                console.error('Lỗi tải cập nhật:', error);
                document.getElementById('update-content').innerText = "Hiện tại chưa có thông tin mới.";
            }
        }

        window.addEventListener('DOMContentLoaded', fetchUpdateInfo);
    </script>
</body>
</html>
