<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" type="image/x-icon" href="ORC.ico">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ORC Studio - List</title>
    <style>
        :root {
            --gura-blue: #99CCFF;
            --gura-dark: #0a0e14;
            --gura-accent: #3399FF;
        }

        /* Tối ưu hóa cuộn trang và hiển thị */
        body, html {
            margin: 0; padding: 0; 
            min-height: 100%; width: 100%;
            background: var(--gura-dark);
            color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            overflow-x: hidden;
            animation: grid-move 10s linear infinite;

        }
         @keyframes grid-move {
            from { background-position: 0 0; }
            to { background-position: 40px 40px; }
         }
        /* Lớp nền đã sửa lỗi viền trắng */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }
        .bg-overlay {
            position: fixed; 
            top: -10px; left: -10px; 
            width: calc(100% + 20px); height: calc(100% + 20px);
            background-color: #000000;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover; 
            filter: blur(5px) brightness(0.4);
            z-index: -1;
            transition: background 0.5s ease, background-color 0.5s ease;
            transform: translateZ(0); /* Tăng tốc phần cứng */
        }

        .pure-nav {
            height: 60px; background: rgba(0, 0, 0, 0.7);
            display: flex; align-items: center; justify-content: center;
            border-bottom: 2px solid var(--gura-blue); width: 100%;
            position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .wrapper { 
            flex: 1; display: flex; flex-direction: column; 
            justify-content: flex-start; align-items: center; 
            padding: 40px 20px; 
        }

        .section-title { 
            color: var(--gura-blue); font-size: 2.5rem; font-weight: bold; 
            margin-bottom: 40px; text-shadow: 0 0 15px rgba(153, 204, 255, 0.5); 
            text-align: center;
        }

        .app-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; width: 100%; max-width: 1000px; 
        }

        .app-card { 
            background: rgba(10, 14, 20, 0.6); 
            border: 1px solid rgba(153, 204, 255, 0.2); 
            border-radius: 20px; padding: 30px; 
            text-align: center; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            backdrop-filter: blur(15px);
            display: flex; flex-direction: column; align-items: center;
        }

        .app-card:hover { 
            background: rgba(153, 204, 255, 0.1); 
            transform: translateY(-10px); 
            border-color: var(--gura-blue); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
        }

        .app-icon { 
            width: 100px; height: 100px; margin-bottom: 20px; 
            border-radius: 22px; object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
        }

        .app-name { font-weight: bold; font-size: 1.4rem; margin: 10px 0; color: #fff; }
        .app-desc { font-size: 0.95rem; color: #cbd5e0; margin-bottom: 25px; line-height: 1.6; flex-grow: 1; }

        .app-buttons { display: flex; gap: 15px; width: 100%; }
        .btn-app-view, .btn-app-dl { 
            padding: 12px; border-radius: 12px; border: none; 
            cursor: pointer; font-size: 0.85rem; font-weight: bold; 
            transition: 0.2s; flex: 1; text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-app-view { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-app-view:hover { background: rgba(255,255,255,0.2); }

        .btn-app-dl { background: linear-gradient(45deg, var(--gura-accent), #0072ff); color: white; }
        .btn-app-dl:hover { filter: brightness(1.1); box-shadow: 0 0 15px rgba(51, 153, 255, 0.4); }

        /* Overlay xem trước */
        #preview-overlay { 
            display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(0,0,0,0.95); z-index: 20000; 
            justify-content: center; align-items: center; backdrop-filter: blur(10px); 
        }
        #preview-img { 
            max-width: 90%; max-height: 85%; border-radius: 10px; 
            border: 2px solid var(--gura-blue); box-shadow: 0 0 40px rgba(0,0,0,0.8); 
        }
        .close-hint { position:absolute; bottom:30px; color: var(--gura-blue); font-weight:bold; letter-spacing: 1px; cursor: pointer; }

        /* Popup */
        #popup-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 10001; 
            justify-content: center; align-items: center; backdrop-filter: blur(5px); 
        }
        #main-popup { 
            width: 90%; max-width: 500px; min-height: 200px; border-radius: 25px; 
            background: var(--gura-dark); position: relative; padding: 40px; 
            box-sizing: border-box; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; 
            border: 1px solid var(--gura-blue); box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .asus-wave-container {
            position: fixed; width: 100%; height: 15vh; bottom: 0; left: 0;
            z-index: 1; pointer-events: none;
        }
        .waves { position: relative; width: 100%; height: 100%; }
        .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
        .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
        .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
        .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }
        @keyframes move-forever {
            0% { transform: translate3d(-90px,0,0); }
            100% { transform: translate3d(85px,0,0); }
        }
        .container { min-height: 100vh; padding-top: 100px; display: flex; flex-direction: column; align-items: center; background: rgba(0, 0, 0, 0.2); }
        .content-box-red { position: relative; z-index: 10; width: 90%; max-width: 600px; padding: 40px; border-radius: 25px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(15px); border: 1px solid rgba(70, 24, 24, 0.1); text-align: center; transition: 0.3s; margin-bottom: 50px; animation: neon-burn-red 1.5s infinite alternate ease-in-out; }
        .content-box-none { position: relative; z-index: 10; width: 90%; max-width: 600px; padding: 40px; border-radius: 25px; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; transition: 0.3s; margin-bottom: 50px; }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div id="preview-overlay" onclick="this.style.display='none'">
        <img id="preview-img" src="" alt="Preview">
        <p class="close-hint">NHẤN VÀO ĐÂY ĐỂ ĐÓNG</p>
    </div>

    <div id="popup-overlay">
        <div id="main-popup">
            <button onclick="document.getElementById('popup-overlay').style.display='none'" style="position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: white; font-size: 20px; cursor: pointer; border-radius: 50%; width: 35px; height: 35px;">&times;</button>
            <div id="popup-text"></div>
        </div>
    </div>

    <nav class="pure-nav">
        <div style="font-weight: bold; color: var(--gura-blue); font-size: 1.3rem; letter-spacing: 3px;">ORICHIIN STUDIO 🦈</div>
    </nav>

    <div class="wrapper">
        <div class="section-title">🚀 Danh sách trang</div>
        
        <div class="app-container">
            <div class="app-card">
                <img src="logo_orc.png" class="app-icon" onerror="this.src='https://www.hentaiorc.xyz/image-video/app-image.png'">
                <div class="app-name">APP</div>
                <div class="app-desc">Tải APP của orichiin studio</div>
                <div class="app-buttons">
                    <button class="btn-app-dl" onclick="window.open('https://www.hentaiorc.xyz/app.html')">Đi đến trang</button>
                </div>
            </div>

            <div class="app-card">
                <img src="https://cdn-icons-png.flaticon.com/512/1055/1055683.png" class="app-icon">
                <div class="app-name">Tin Học Vector 10</div>
                <div class="app-desc">Các file tin học vector cho học sinh lớp 10</div>
                <div class="app-buttons">
                    <button class="btn-app-dl" onclick="window.open('https://www.hentaiorc.xyz/tinhoc10.html')">Đi đến trang</button>
                </div>
            </div>
        </div>
    </div>
    <div class="asus-wave-container">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use href="#gentle-wave" x="48" y="0" fill="rgba(0, 243, 255, 0.2)" />
                <use href="#gentle-wave" x="48" y="3" fill="rgba(0, 243, 255, 0.3)" />
                <use href="#gentle-wave" x="48" y="5" fill="rgba(0, 243, 255, 0.1)" />
                <use href="#gentle-wave" x="48" y="7" fill="rgba(0, 243, 255, 0.5)" />
            </g>
        </svg>
    </div>
    <script>
        function previewApp(imgUrl) {
            const overlay = document.getElementById('preview-overlay');
            const img = document.getElementById('preview-img');
            img.src = imgUrl;
            overlay.style.display = 'flex';
        }

        // Tự động đóng popup bằng phím Esc
        window.addEventListener('keydown', function(e) {
            if (e.key === "Escape") {
                document.getElementById('preview-overlay').style.display = 'none';
                document.getElementById('popup-overlay').style.display = 'none';
            }
        });
    </script>
</body>
</html>
