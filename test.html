<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Cuối Kì - Trắc Nghiệm Lịch Sử</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --text-color: #333;
            --card-bg: #fff;
            --warning-color: #e74c3c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        h1, h2, h3 {
            text-align: center;
            color: var(--primary-color);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #357abd;
        }
        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .option-btn {
            background-color: #eef2f5;
            color: var(--text-color);
            text-align: left;
        }
        .option-btn:hover {
            background-color: #d6e0e9;
        }
        .tf-group {
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-left: 4px solid var(--primary-color);
        }
        .tf-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .tf-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
            border-radius: 4px;
        }
        .tf-btn.selected-true { background-color: #2ecc71; color: white; border-color: #2ecc71; }
        .tf-btn.selected-false { background-color: #e74c3c; color: white; border-color: #e74c3c; }
        .hidden {
            display: none !important;
        }
        #warning-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(231, 76, 60, 0.95);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #warning-overlay h1 { color: white; }
        .score-text { font-size: 24px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div id="start-screen" class="container">
        <h1>Mini Game Trắc Nghiệm</h1>
        <p style="text-align: center;">Lưu ý: Không được chuyển tab hay rời khỏi màn hình trong quá trình làm bài!</p>
        <button class="btn" onclick="startQuiz()">Bắt đầu ngay</button>
    </div>

    <div id="warning-overlay" class="hidden">
        <h1>CẢNH BÁO GIAN LẬN!</h1>
        <p>Hệ thống phát hiện bạn đã rời khỏi màn hình làm bài.</p>
        <button class="btn" style="background: white; color: var(--warning-color); width: 200px;" onclick="resumeQuiz()">Tiếp tục làm bài</button>
    </div>

    <div id="quiz-screen" class="container hidden">
        <h2 id="question-title">Câu hỏi</h2>
        <p id="context-text" style="font-style: italic; margin-bottom: 20px;"></p>
        <div id="options-container"></div>
        <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Tiếp theo</button>
    </div>

    <div id="result-screen" class="container hidden">
        <h1>Hoàn Thành!</h1>
        <p class="score-text">Điểm của bạn: <span id="score">0</span> / <span id="total-score">0</span></p>
        <p id="cheat-count-text" style="text-align: center; color: var(--warning-color);"></p>
        <button class="btn" onclick="location.reload()">Làm lại</button>
    </div>

    <script>
        // Dữ liệu câu hỏi (Bạn copy thêm các câu từ file Word vào đây)
        const quizData = [
    // --- PHẦN TRẮC NGHIỆM (Câu 1 - Câu 40) ---
    { type: "mcq", question: "Câu 1. Nội dung nào sau đây là cơ sở kinh tế dẫn đến sự hình thành nền văn minh Văn Lang - Âu Lạc?", options: ["A. Bắt đầu xuất hiện sự phân hóa giữa các tầng lớp xã hội.", "B. Nông nghiệp trồng lúa nước đạt trình độ phát triển cao.", "C. Hoạt động thương nghiệp đường biển đặc biệt phát triển.", "D. Nhu cầu chống giặc ngoại xâm ngày càng trở nên bức thiết."], answer: 1 },
    { type: "mcq", question: "Câu 2. Nội dung nào sau đây phản ánh đúng về tổ chức xã hội và Nhà nước Văn Lang – Âu Lạc?", options: ["A. Nhà nước quân chủ chuyên chế tập quyền cao.", "B. Nhà nước sơ khai do vua đứng đầu, dưới có Lạc hầu, Lạc tướng.", "C. Xã hội phân chia giai cấp sâu sắc, mâu thuẫn gay gắt.", "D. Bộ máy nhà nước hoàn chỉnh, có luật pháp chặt chẽ."], answer: 1 },
    { type: "mcq", question: "Câu 3. Việc chia đất nước thành các bộ và cử Lạc tướng cai quản cho thấy Nhà nước Văn Lang – Âu Lạc", options: ["A. bước đầu tổ chức quản lí xã hội trên phạm vi lãnh thổ rộng.", "B. áp dụng mô hình nhà nước phương Tây cổ đại.", "C. hoàn toàn xóa bỏ vai trò của cộng đồng làng xã.", "D. đã có bộ máy nhà nước quan liêu phức tạp."], answer: 0 },
    { type: "mcq", question: "Câu 4. Bộ máy nhà nước Văn Lang – Âu Lạc được xem là tiến bộ vì", options: ["A. thể hiện sự phân công quản lí giữa trung ương và địa phương.", "B. quản lí xã hội chủ yếu bằng pháp luật thành văn.", "C. được tổ chức giống với nhà nước phong kiến Trung Quốc.", "D. có đầy đủ các cơ quan lập pháp, hành pháp và tư pháp."], answer: 0 },
    { type: "mcq", question: "Câu 5. Nền văn minh Văn Lang - Âu Lạc được hình thành ở khu vực nào sau đây của Việt Nam?", options: ["A. Vùng duyên hải và cao nguyên miền Trung Việt Nam.", "B. Lưu vực sông Hồng, sông Thu Bồn và sông Cửu Long.", "C. Khu vực Bắc Bộ và Bắc Trung Bộ Việt Nam ngày nay.", "D. Vùng ven biển Nam Trung Bộ và Nam Bộ Việt Nam."], answer: 2 },
    { type: "mcq", question: "Câu 6. Điều kiện tự nhiên nào sau đây tạo thuận lợi cho cư dân Văn Lang – Âu Lạc phát triển ngành nông nghiệp lúa nước?", options: ["A. Khí hậu khô hạn, lượng nhiệt lớn", "B. Tài nguyên khoáng sản phong phú", "C. Tiếp giáp với các nền văn minh lớn", "D. Hệ thống đất phù sa màu mỡ"], answer: 3 },
    { type: "mcq", question: "Câu 7. Trong bộ máy nhà nước Văn Lang – Âu Lạc, người đứng đầu là ai?", options: ["A. Lạc hầu", "B. Lạc tướng", "C. Vua (Hùng Vương/An Dương Vương)", "D. Quan lại"], answer: 2 },
    { type: "mcq", question: "Câu 8. Một trong những công trình kiến trúc tiêu biểu được xây dựng dưới thời kì nhà nước Âu Lạc là", options: ["A. thành Cổ Loa", "B. tháp Phổ Minh", "C. chùa Một Cột", "D. kinh thành Huế"], answer: 0 },
    { type: "mcq", question: "Câu 9. Nội dung nào sau đây phản ánh sự phát triển kinh tế của cư dân Văn Lang - Âu Lạc?", options: ["A. Thương nghiệp đường biển phát triển vượt bậc.", "B. Làm chủ nhiều vùng rộng lớn ở Đông Nam Á.", "C. Kĩ thuật luyện kim, đúc đồng đạt trình độ cao.", "D. Kĩ thuật đóng gạch xây tháp đạt mức hoàn mĩ."], answer: 2 },
    { type: "mcq", question: "Câu 10. Ngành kinh tế nào sau đây phát triển mạnh dưới thời kì Văn Lang – Âu Lạc?", options: ["A. Chế tạo máy", "B. Làm giấy", "C. Đóng tàu biển", "D. Trồng lúa nước"], answer: 3 },
    { type: "mcq", question: "Câu 11. Một cơ sở quan trọng hình thành văn minh Đại Việt là kế thừa từ nền văn minh nào?", options: ["A. Văn minh Văn Lang – Âu Lạc", "B. Văn minh Trung Hoa", "C. Văn minh Ấn Độ", "D. Văn minh Chăm-pa"], answer: 0 },
    { type: "mcq", question: "Câu 12. Yếu tố nào tạo điều kiện quan trọng giúp văn minh Đại Việt phát triển?", options: ["A. Mở rộng lãnh thổ về phía Nam", "B. Đất nước độc lập, tự chủ", "C. Phát triển thương mại biển", "D. Giao lưu với các nước phương Tây"], answer: 1 },
    { type: "mcq", question: "Câu 13. Văn minh Đại Việt chịu ảnh hưởng của những nền văn hóa nào?", options: ["A. Ấn Độ và Ba Tư", "B. Trung Quốc và Ấn Độ", "C. Trung Quốc và Nhật Bản", "D. Nhật Bản và Triều Tiên"], answer: 1 },
    { type: "mcq", question: "Câu 14. Tôn giáo nào có ảnh hưởng lớn đến đời sống tinh thần của người Đại Việt thời trung đại?", options: ["A. Hồi giáo", "B. Do Thái giáo", "C. Thiên Chúa giáo", "D. Phật giáo"], answer: 3 },
    { type: "mcq", question: "Câu 15. Người Đại Việt kế thừa truyền thống văn hóa nào từ cư dân Văn Lang – Âu Lạc?", options: ["A. Thương mại biển", "B. Săn bắt – hái lượm", "C. Văn hóa du mục", "D. Trồng lúa nước"], answer: 3 },
    { type: "mcq", question: "Câu 16. Một trong những cơ sở tự nhiên góp phần hình thành văn minh Đại Việt là gì?", options: ["A. Sa mạc khô hạn", "B. Khí hậu lạnh giá", "C. Đồng bằng màu mỡ, nhiều sông ngòi", "D. Núi cao hiểm trở"], answer: 2 },
    { type: "mcq", question: "Câu 17. Trong quá trình phát triển, văn minh Đại Việt gắn liền với hoạt động kinh tế nào là chủ yếu?", options: ["A. Đánh bắt xa bờ", "B. Khai thác dầu mỏ", "C. Chăn nuôi du mục", "D. Trồng lúa nước"], answer: 3 },
    { type: "mcq", question: "Câu 18. Một đặc điểm của văn minh Đại Việt trong thời kì phát triển là:", options: ["A. Có sự kết hợp giữa yếu tố truyền thống và tiếp thu bên ngoài", "B. Không có sự giao lưu văn hóa", "C. Chỉ phát triển quân sự", "D. Phát triển tách biệt hoàn toàn"], answer: 0 },
    { type: "mcq", question: "Câu 19. Trong các yếu tố sau, yếu tố nào giúp văn minh Đại Việt duy trì và phát triển lâu dài?", options: ["A. Phụ thuộc hoàn toàn nước ngoài", "B. Chiến tranh liên tục", "C. Sự ổn định của nhà nước phong kiến", "D. Không có chính quyền"], answer: 2 },
    { type: "mcq", question: "Câu 20. Quá trình phát triển của văn minh Đại Việt diễn ra chủ yếu trong giai đoạn nào?", options: ["A. Thời kì hiện đại", "B. Thời kì Bắc thuộc", "C. Thời nguyên thủy", "D. Thời kì các triều đại phong kiến độc lập"], answer: 3 },
    { type: "mcq", question: "Câu 21. Nền kinh tế chủ yếu của cư dân Đại Việt thời trung đại là", options: ["A. luyện kim.", "B. thương nghiệp biển.", "C. chăn nuôi.", "D. nông nghiệp trồng lúa nước."], answer: 3 },
    { type: "mcq", question: "Câu 22. Nhà nước Đại Việt thời phong kiến được tổ chức theo mô hình", options: ["A. nhà nước liên bang.", "B. nhà nước quân chủ trung ương tập quyền.", "C. nhà nước dân chủ.", "D. nhà nước cộng hòa."], answer: 1 },
    { type: "mcq", question: "Câu 23. Triều đại nào sau đây ban hành Quốc triều hình luật (Luật Hồng Đức)?", options: ["A. Nhà Lý", "B. Nhà Lê sơ", "C. Nhà Nguyễn", "D. Nhà Trần"], answer: 1 },
    { type: "mcq", question: "Câu 24. Tôn giáo có ảnh hưởng lớn nhất đến đời sống tinh thần của cư dân Đại Việt thời Lý – Trần là", options: ["A. Nho giáo.", "B. Thiên Chúa giáo.", "C. Phật giáo.", "D. Ấn Độ giáo."], answer: 2 },
    { type: "mcq", question: "Câu 25. Tư tưởng nào giữ vai trò quan trọng trong quản lí nhà nước Đại Việt thời phong kiến?", options: ["A. Đạo giáo", "B. Hồi giáo", "C. Nho giáo", "D. Phật giáo"], answer: 2 },
    { type: "mcq", question: "Câu 26. Bài thơ “Nam quốc sơn hà” thường được xem là", options: ["A. tác phẩm văn học thời Nguyễn.", "B. bản tuyên ngôn độc lập đầu tiên của Việt Nam.", "C. bản tuyên ngôn độc lập thứ hai của Việt Nam.", "D. bài thơ chữ Nôm đầu tiên của Việt Nam."], answer: 1 },
    { type: "mcq", question: "Câu 27. Văn Miếu – Quốc Tử Giám được xây dựng dưới triều đại nào?", options: ["A. Nhà Lý", "B. Nhà Tiền Lê", "C. Nhà Đinh", "D. Nhà Nguyễn"], answer: 0 },
    { type: "mcq", question: "Câu 28. Ai là tác giả của tác phẩm “Bình Ngô đại cáo”?", options: ["A. Lý Thường Kiệt", "B. Lê Thánh Tông", "C. Nguyễn Trãi", "D. Trần Quốc Tuấn"], answer: 2 },
    { type: "mcq", question: "Câu 29. Tác phẩm “Đại Việt sử kí” do ai biên soạn?", options: ["A. Ngô Sĩ Liên", "B. Lê Văn Hưu", "C. Trần Quốc Tuấn", "D. Nguyễn Trãi"], answer: 1 },
    { type: "mcq", question: "Câu 30. Thành tựu nào sau đây thuộc lĩnh vực nghệ thuật điêu khắc của văn minh Đại Việt?", options: ["A. Tượng rồng đá thời Lý", "B. Kim tự tháp Ai Cập", "C. Đền Parthenon", "D. Tượng Phật chùa Tây Phương"], answer: 0 },
    { type: "mcq", question: "Câu 31. Đặc điểm về thành phần dân tộc ở Việt Nam hiện nay là", options: ["A. có sự đa dạng dân tộc, trong đó dân tộc Kinh chiếm đa số", "B. các dân tộc đều có quy mô dân số tương đương nhau", "C. các dân tộc thiểu số có xu hướng chiếm tỉ lệ ngày càng lớn", "D. có nhiều dân tộc với sự phát triển khá đồng đều"], answer: 0 },
    { type: "mcq", question: "Câu 32. Đặc điểm phân bố dân cư của các dân tộc Việt Nam là", options: ["A. có sự phân bố không đều, gắn với điều kiện tự nhiên", "B. chủ yếu tập trung ở khu vực đồng bằng", "C. phân bố khá đồng đều giữa các vùng", "D. các dân tộc có xu hướng tập trung tại đô thị"], answer: 0 },
    { type: "mcq", question: "Câu 33. Việc phân chia các dân tộc theo ngữ hệ cho thấy", options: ["A. sự phân bố theo lãnh thổ", "B. sự khác biệt về trình độ phát triển", "C. sự đa dạng về nguồn gốc ngôn ngữ", "D. sự khác nhau về đời sống vật chất"], answer: 2 },
    { type: "mcq", question: "Câu 34. Trang phục truyền thống của các dân tộc có vai trò", options: ["A. góp phần phân biệt các vùng địa lí", "B. thể hiện xu hướng phát triển xã hội", "C. phản ánh bản sắc văn hóa riêng của mỗi dân tộc", "D. thể hiện điều kiện kinh tế của từng vùng"], answer: 2 },
    { type: "mcq", question: "Câu 35. Nhận xét đúng về nền văn hóa các dân tộc Việt Nam là", options: ["A. có xu hướng tách biệt rõ rệt", "B. có sự phát triển theo hướng đồng nhất", "C. chịu ảnh hưởng chủ yếu từ bên ngoài", "D. vừa đa dạng vừa thống nhất"], answer: 3 },
    { type: "mcq", question: "Câu 36. Nhận xét đúng về chữ viết của các dân tộc Việt Nam là", options: ["A. cho thấy sự khác biệt về chính trị", "B. góp phần lưu giữ và phát triển văn hóa dân tộc", "C. phản ánh sự phân bố dân cư", "D. thể hiện sự phát triển về kinh tế"], answer: 1 },
    { type: "mcq", question: "Câu 37. Âm nhạc dân gian của các dân tộc Việt Nam", options: ["A. chỉ phản ánh hoạt động lao động", "B. phản ánh đời sống tinh thần phong phú", "C. chỉ dùng trong lễ hội", "D. không liên quan đến văn hóa"], answer: 1 },
    { type: "mcq", question: "Câu 38. Ý nghĩa của khối đại đoàn kết các dân tộc là", options: ["A. thúc đẩy giao lưu văn hóa", "B. góp phần xây dựng và bảo vệ đất nước", "C. tăng cường sự phát triển xã hội", "D. tạo điều kiện phát triển kinh tế"], answer: 1 },
    { type: "mcq", question: "Câu 39. Việc bảo tồn văn hóa các dân tộc Việt Nam hiện nay nhằm", options: ["A. giữ gìn và phát huy bản sắc văn hóa dân tộc", "B. thúc đẩy hiện đại hóa xã hội", "C. phát triển du lịch và kinh tế", "D. tăng cường giao lưu quốc tế"], answer: 0 },
    { type: "mcq", question: "Câu 40. Vai trò của lễ hội trong đời sống các dân tộc là", options: ["A. thay thế lao động sản xuất", "B. chỉ để giải trí", "C. xây dựng kinh tế", "D. gắn kết cộng đồng và bảo tồn văn hóa"], answer: 3 },

        document.addEventListener("visibilitychange", () => {
            if (document.hidden && isQuizActive) {
                triggerCheatWarning();
            }
        });

        window.addEventListener("blur", () => {
            if (isQuizActive) {
                triggerCheatWarning();
            }
        });

        function triggerCheatWarning() {
            cheatCount++;
            document.getElementById("warning-overlay").classList.remove("hidden");
        }

        function resumeQuiz() {
            document.getElementById("warning-overlay").classList.add("hidden");
        }

        function startQuiz() {
            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            isQuizActive = true;
            loadQuestion();
        }

        function loadQuestion() {
            const currentQuestion = quizData[currentQuestionIndex];
            const titleEl = document.getElementById("question-title");
            const contextEl = document.getElementById("context-text");
            const optionsContainer = document.getElementById("options-container");
            const nextBtn = document.getElementById("next-btn");

            titleEl.innerText = currentQuestion.question;
            optionsContainer.innerHTML = "";
            nextBtn.classList.add("hidden");
            
            if (currentQuestion.context) {
                contextEl.innerText = currentQuestion.context;
                contextEl.style.display = "block";
            } else {
                contextEl.style.display = "none";
            }

            if (currentQuestion.type === "mcq") {
                currentQuestion.options.forEach((option, index) => {
                    const button = document.createElement("button");
                    button.innerText = option;
                    button.classList.add("btn", "option-btn");
                    button.onclick = () => selectMcqAnswer(index, button);
                    optionsContainer.appendChild(button);
                });
            } else if (currentQuestion.type === "tf") {
                userTfAnswers = new Array(currentQuestion.statements.length).fill(null);
                currentQuestion.statements.forEach((stmt, index) => {
                    const group = document.createElement("div");
                    group.classList.add("tf-group");
                    
                    const stmtText = document.createElement("p");
                    stmtText.innerText = stmt.text;
                    
                    const btnGroup = document.createElement("div");
                    btnGroup.classList.add("tf-buttons");
                    
                    const btnTrue = document.createElement("button");
                    btnTrue.innerText = "Đúng";
                    btnTrue.classList.add("tf-btn");
                    btnTrue.onclick = () => selectTfAnswer(index, true, btnTrue, btnFalse);
                    
                    const btnFalse = document.createElement("button");
                    btnFalse.innerText = "Sai";
                    btnFalse.classList.add("tf-btn");
                    btnFalse.onclick = () => selectTfAnswer(index, false, btnFalse, btnTrue);

                    btnGroup.appendChild(btnTrue);
                    btnGroup.appendChild(btnFalse);
                    group.appendChild(stmtText);
                    group.appendChild(btnGroup);
                    optionsContainer.appendChild(group);
                });
                
                // Hiển thị nút "Tiếp theo" ngay đối với câu hỏi Đúng/Sai để người dùng chốt đáp án
                nextBtn.classList.remove("hidden");
                nextBtn.onclick = checkTfAnswers;
            }
        }

        function selectMcqAnswer(selectedIndex, selectedButton) {
            const currentQuestion = quizData[currentQuestionIndex];
            const buttons = document.querySelectorAll(".option-btn");
            
            // Khóa các nút sau khi chọn
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQuestion.answer) {
                selectedButton.style.backgroundColor = "#2ecc71";
                selectedButton.style.color = "white";
                score++;
            } else {
                selectedButton.style.backgroundColor = "#e74c3c";
                selectedButton.style.color = "white";
                // Hiện đáp án đúng
                buttons[currentQuestion.answer].style.backgroundColor = "#2ecc71";
                buttons[currentQuestion.answer].style.color = "white";
            }

            const nextBtn = document.getElementById("next-btn");
            nextBtn.classList.remove("hidden");
            nextBtn.onclick = nextQuestion;
        }

        function selectTfAnswer(stmtIndex, answer, selectedBtn, otherBtn) {
            userTfAnswers[stmtIndex] = answer;
            
            if (answer === true) {
                selectedBtn.classList.add("selected-true");
                selectedBtn.classList.remove("selected-false");
                otherBtn.classList.remove("selected-false");
            } else {
                selectedBtn.classList.add("selected-false");
                selectedBtn.classList.remove("selected-true");
                otherBtn.classList.remove("selected-true");
            }
        }

        function checkTfAnswers() {
            const currentQuestion = quizData[currentQuestionIndex];
            let isAllAnswered = userTfAnswers.every(ans => ans !== null);
            
            if (!isAllAnswered) {
                alert("Vui lòng trả lời đầy đủ Đúng/Sai cho các ý!");
                return;
            }

            // Tính điểm: Mỗi ý đúng được tính là 0.25 điểm hoặc có thể cộng dồn tùy ý bạn. Ở đây Gem tính mỗi câu hỏi lớn là 1 điểm nếu đúng hoàn toàn.
            let correctCount = 0;
            currentQuestion.statements.forEach((stmt, idx) => {
                if (userTfAnswers[idx] === stmt.answer) correctCount++;
            });

            if (correctCount === currentQuestion.statements.length) {
                score++; // Cả 4 ý đều đúng mới được 1 điểm tròn (Bạn có thể tự chỉnh sửa logic cộng điểm này)
            }

            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            isQuizActive = false;
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            
            document.getElementById("score").innerText = score;
            document.getElementById("total-score").innerText = quizData.length;
            
            const cheatText = document.getElementById("cheat-count-text");
            if (cheatCount > 0) {
                cheatText.innerText = `Lưu ý: Bạn đã rời khỏi màn hình làm bài ${cheatCount} lần.`;
            } else {
                cheatText.innerText = "Tuyệt vời! Bạn không hề gian lận trong quá trình làm bài.";
                cheatText.style.color = "#2ecc71";
            }
        }
    </script>
</body>
