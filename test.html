let selectedMode='both';
let questions=[];
let current=0;
let answers=[];
let score=0;
let timer;
let timeLeft=3600;

function go(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
window.scrollTo(0,0);
}

function setFont(v){
document.documentElement.style.setProperty('--fs',v+'px');
}

function toggleDark(){
if(document.body.dataset.theme==='dark')
document.body.dataset.theme='';
else
document.body.dataset.theme='dark';
}

function pickMode(el){
document.querySelectorAll('.mode-card').forEach(x=>x.classList.remove('selected'));
el.classList.add('selected');
selectedMode=el.dataset.mode;
}

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
return arr;
}

function shuffleQuestion(q){
if(q.type!=='mcq') return q;

const data=q.options.map((x,i)=>({text:x,idx:i}));
shuffle(data);
q.options=data.map(x=>x.text);
q.answer=data.findIndex(x=>x.idx===q.answer);
return q;
}

function startQuiz(){

questions=quizData.filter(q=>{
if(selectedMode==='both') return true;
return q.type===selectedMode;
});

const order=document.getElementById('order').value;

if(order==='mcq'){
questions.sort((a,b)=>a.type==='mcq'?-1:1);
}

if(order==='tf'){
questions.sort((a,b)=>a.type==='tf'?-1:1);
}

questions=shuffle(questions).map(q=>shuffleQuestion(JSON.parse(JSON.stringify(q))));

current=0;
score=0;
answers=new Array(questions.length).fill(null);

timeLeft=3600;

startTimer();

go('quiz');
render();
}

function startTimer(){
clearInterval(timer);

timer=setInterval(()=>{

timeLeft--;

const m=String(Math.floor(timeLeft/60)).padStart(2,'0');
const s=String(timeLeft%60).padStart(2,'0');

document.getElementById('timer').textContent=`⏰ ${m}:${s}`;

if(timeLeft<=0){
showResult();
}

},1000);
}

function render(){

const q=questions[current];

const pct=((current+1)/questions.length)*100;

document.getElementById('bar').style.width=pct+'%';

document.getElementById('progressText').textContent=`  ${current+1}/${questions.length}`;
document.getElementById('scoreText').textContent=`${score} điểm`;

document.getElementById('question').textContent=q.question;

const context=document.getElementById('context');
context.innerHTML='';

if(q.context){
context.innerHTML=`<div style="padding:14px;background:#f8fafc;border-left:4px solid #2563eb;border-radius:10px;margin-bottom:15px;line-height:1.7;">${q.context}</div>`;
}

const box=document.getElementById('options');
box.innerHTML='';

if(q.type==='mcq'){

q.options.forEach((opt,i)=>{

const btn=document.createElement('button');
btn.className='option';
btn.textContent=opt;

if(answers[current]!==null){
btn.disabled=true;

if(i===q.answer)
btn.classList.add('correct');

if(i===answers[current]&&i!==q.answer)
btn.classList.add('wrong');
}

btn.onclick=()=>answerMCQ(i);
box.appendChild(btn);

});

}else{

q.statements.forEach((s,i)=>{

const wrap=document.createElement('div');
wrap.className='option';

wrap.innerHTML=`
<div style="margin-bottom:10px;font-weight:600;line-height:1.6;">${s.text}</div>
<div style="display:flex;gap:10px;">
<button class="btn btn-success" onclick="answerTF(${i},true)">Đúng</button>
<button class="btn" style="background:#dc2626;color:white;" onclick="answerTF(${i},false)">Sai</button>
</div>
`;

box.appendChild(wrap);

});
}

buildQuick();
}

function answerMCQ(i){

if(answers[current]!==null) return;

answers[current]=i;

if(i===questions[current].answer)
score++;

save();
render();
}

function answerTF(idx,val){

if(!Array.isArray(answers[current]))
answers[current]=[];

answers[current][idx]=val;

if(answers[current].length===questions[current].statements.length){

let ok=true;

questions[current].statements.forEach((s,i)=>{
if(s.answer!==answers[current][i])
ok=false;
});

if(ok)
score++;
}

save();
render();
}

function nextQuestion(){
if(current<questions.length-1){
current++;
render();
}else{
showResult();
}
}

function prevQuestion(){
if(current>0){
current--;
render();
}
}

function buildQuick(){

const q=document.getElementById('quick');
q.innerHTML='';

questions.forEach((x,i)=>{

const b=document.createElement('button');

b.textContent=i+1;

if(i===current)
b.style.border='3px solid #2563eb';

if(answers[i]!==null)
b.style.background='#22c55e';

b.onclick=()=>{
current=i;
render();
};

q.appendChild(b);
});
}

function showResult(){

clearInterval(timer);

let correct=0;
let wrong=0;
let skip=0;

questions.forEach((q,i)=>{

if(answers[i]===null){
skip++;
return;
}

if(q.type==='mcq'){

if(answers[i]===q.answer)
correct++;
else
wrong++;

}else{

let ok=true;

q.statements.forEach((s,si)=>{
if(answers[i][si]!==s.answer)
ok=false;
});

if(ok)
correct++;
else
wrong++;
}

});

const pct=Math.round(correct/questions.length*100);

document.getElementById('finalScore').textContent=pct+'%';
document.getElementById('correctCount').textContent=correct;
document.getElementById('wrongCount').textContent=wrong;
document.getElementById('skipCount').textContent=skip;
document.getElementById('resultFill').style.width=pct+'%';

let rank='';

if(pct>=90)
rank='🌟 Xuất sắc';
else if(pct>=75)
rank='🔥 Giỏi';
else if(pct>=60)
rank='👍 Khá';
else if(pct>=40)
rank='⚠️ Trung bình';
else
rank='❌ Cần ôn thêm';

document.getElementById('rank').textContent=rank;

go('result');
}

function buildReview(){

const list=document.getElementById('reviewList');
list.innerHTML='';

questions.forEach((q,i)=>{

const div=document.createElement('div');

let ok=false;

if(q.type==='mcq')
ok=answers[i]===q.answer;

if(q.type==='tf'&&answers[i]){
ok=true;
q.statements.forEach((s,si)=>{
if(answers[i][si]!==s.answer)
ok=false;
});
}

div.className='review-item '+(ok?'correct':'wrong');

let html=`<h3 style="margin-bottom:10px;">${q.question}</h3>`;

if(q.type==='mcq'){

html+=`
<p><b>Bạn chọn:</b> ${answers[i]!=null?q.options[answers[i]]:'Chưa trả lời'}</p>
<p><b>Đáp án đúng:</b> ${q.options[q.answer]}</p>
`;

}else{

q.statements.forEach((s,si)=>{
html+=`<p style="margin-top:8px;">${s.text} → <b>${s.answer?'Đúng':'Sai'}</b></p>`;
});
}

div.innerHTML=html;
list.appendChild(div);

});
}

function restart(){
go('mode');
}

function save(){
localStorage.setItem('historyQuizSave',JSON.stringify({
questions,
current,
answers,
score,
timeLeft
}));
}

function restore(){

const data=JSON.parse(localStorage.getItem('historyQuizSave')||'null');

if(!data) return;

if(confirm('Khôi phục bài làm trước?')){

questions=data.questions;
current=data.current;
answers=data.answers;
score=data.score;
timeLeft=data.timeLeft;

startTimer();
go('quiz');
render();
}
}

restore();

</script>
